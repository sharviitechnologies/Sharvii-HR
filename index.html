  const year = +istDate().slice(0, 4), st = S.settings;
  const hols = S.holidays.filter(h => h.holiday_date >= `${year}-01-01`);
  const t5 = t => String(t || '').slice(0, 5);
  el.innerHTML = `<div class="grid g-2">
    <div class="grid" style="align-content:start">
      <div class="card"><div class="card-h"><h2>Shift &amp; working days</h2></div><div class="card-b">
        <div class="form-grid">
          <div class="field"><label for="sh-start">Shift starts</label><input id="sh-start" type="time" value="${t5(st.shift_start)}"></div>
          <div class="field"><label for="sh-end">Shift ends</label><input id="sh-end" type="time" value="${t5(st.shift_end)}"></div>
          <div class="field"><label for="sh-open">Check-in opens</label><input id="sh-open" type="time" value="${t5(st.checkin_opens)}"></div>
          <div class="field"><label for="sh-cclose">Check-in closes</label><input id="sh-cclose" type="time" value="${t5(st.checkin_closes || '11:00')}"><span class="hint">After this, check-in is blocked for the day.</span></div>
          <div class="field"><label for="sh-close">Check-out closes</label><input id="sh-close" type="time" value="${t5(st.checkout_closes)}"><span class="hint">Without a check-out by then, the day counts as leave.</span></div>
          <div class="field"><label for="sh-grace">Late after (minutes past start)</label><input id="sh-grace" type="number" min="0" max="120" value="${st.late_grace_minutes}"></div>
          <div class="field"><label for="sh-sat">Saturdays</label><select id="sh-sat">${[['none', 'All Saturdays working'], ['second', '2nd Saturday off'], ['second_fourth', '2nd & 4th Saturdays off'], ['all', 'All Saturdays off']].map(([v, l]) => `<option value="${v}" ${st.saturday_rule === v ? 'selected' : ''}>${l}</option>`).join('')}</select><span class="hint">Sundays are always off.</span></div>
          <div class="field"><label for="sh-track">Count attendance from</label><input id="sh-track" type="date" value="${esc(st.tracking_start)}"><span class="hint">Earlier days aren't marked absent.</span></div>
        </div>
        <div style="margin-top:16px"><button class="btn primary" id="sh-save">Save shift settings</button></div>
      </div></div>
      <div class="card"><div class="card-h"><h2>Leave types</h2><span class="sub">Days per year</span></div>
        <div class="table-wrap"><table><thead><tr><th>Name</th><th>Code</th><th>Days / year</th><th>Paid</th><th>Active</th><th></th></tr></thead><tbody>
        ${S.leaveTypes.map(t => `<tr data-lt="${t.id}"><td><input type="text" data-k="name" value="${esc(t.name)}"></td><td><input type="text" data-k="code" value="${esc(t.code)}" style="width:70px"></td><td><input type="number" data-k="annual_quota" min="0" step="0.5" value="${num(t.annual_quota)}" style="width:80px"></td><td><input type="checkbox" data-k="is_paid" ${t.is_paid ? 'checked' : ''} aria-label="Paid"></td><td><input type="checkbox" data-k="is_active" ${t.is_active ? 'checked' : ''} aria-label="Active"></td><td><button class="btn sm" data-save-lt>Save</button></td></tr>`).join('')}
        <tr data-lt="new"><td><input type="text" data-k="name" placeholder="New leave type"></td><td><input type="text" data-k="code" placeholder="Code" style="width:70px"></td><td><input type="number" data-k="annual_quota" min="0" step="0.5" value="0" style="width:80px"></td><td><input type="checkbox" data-k="is_paid" checked aria-label="Paid"></td><td><input type="checkbox" data-k="is_active" checked aria-label="Active"></td><td><button class="btn primary sm" data-save-lt>Add</button></td></tr>
        </tbody></table></div></div>
      <div class="card"><div class="card-h"><h2>Data backup</h2></div><div class="card-b">
        <p class="muted" style="margin-top:0">All data is saved in your Supabase database. On the free plan there are no automatic backups, so download a copy once a month and keep it in Google Drive.</p>
        <button class="btn primary" id="bk-run">${icon('download')}Download backup</button></div></div>
      <div class="card"><div class="card-h"><h2>Yearly leave allotment</h2></div><div class="card-b">
        <p class="muted" style="margin-top:0">Gives every active employee the yearly days for each paid leave type. People who already have a balance for that year are not changed, so it's safe to run again after adding new staff. To change one person's days, use Edit on the Employees page.</p>
        <div class="toolbar" style="margin:0"><div class="field"><label for="al-year">Year</label><input id="al-year" type="number" value="${year}" style="width:110px"></div><button class="btn primary" id="al-run">Allot leave</button></div></div></div>
    </div>
    <div class="card" style="align-self:start"><div class="card-h"><h2>Holidays</h2><span class="sub">${year} onwards</span></div>
      <div class="card-b"><form id="h-form" class="toolbar" style="margin-bottom:8px"><div class="field"><label for="h-date">Date</label><input id="h-date" type="date" required></div><div class="field grow"><label for="h-name">Name</label><input id="h-name" type="text" placeholder="e.g. Sankranti" required></div><button class="btn primary" type="submit">Add</button></form>
      <p class="muted" style="font-size:13px;margin:0 0 6px">Sundays and ${st.saturday_rule === 'none' ? 'no Saturdays' : st.saturday_rule === 'all' ? 'all Saturdays' : st.saturday_rule === 'second' ? '2nd Saturdays' : '2nd &amp; 4th Saturdays'} are off automatically, so you don't need to add them.</p>
      ${hols.length ? hols.map(h => { const dow = dObj(h.holiday_date).getDay(); return `<div class="list-row"><span class="date-chip"><b>${dObj(h.holiday_date).getDate()}</b><small>${dObj(h.holiday_date).toLocaleDateString('en-IN', { month: 'short' })}</small></span><div style="flex:1"><b>${esc(h.name)}</b><div class="muted" style="font-size:13px">${dObj(h.holiday_date).toLocaleDateString('en-IN', { weekday: 'long', year: 'numeric' })}${dow === 0 ? ' (already a day off)' : ''}</div></div><button class="btn danger sm" data-del-h="${h.id}">Remove</button></div>`; }).join('') : '<div class="empty">No holidays added yet.</div>'}
      </div></div></div>`;

  $('#bk-run').onclick = async e => { const b = e.currentTarget, h = b.innerHTML; b.disabled = true; b.textContent = 'Preparing…'; try { await downloadBackup(); toast('Backup downloaded. Keep it in Google Drive.'); } catch (err) { toast(err.message, 'bad'); } b.disabled = false; b.innerHTML = h; };
  $('#sh-save').onclick = async () => {
    const v = id => $(id).value;
    const row = { shift_start: v('#sh-start'), shift_end: v('#sh-end'), checkin_opens: v('#sh-open'), checkin_closes: v('#sh-cclose'), checkout_closes: v('#sh-close'), late_grace_minutes: +v('#sh-grace') || 0, saturday_rule: v('#sh-sat'), tracking_start: v('#sh-track'), updated_at: new Date().toISOString() };
    if (!(row.checkin_opens <= row.shift_start && row.shift_start < row.checkin_closes && row.checkin_closes <= row.shift_end && row.shift_end <= row.checkout_closes)) return toast('Times must go in order: check-in opens, shift starts, check-in closes, shift ends, check-out closes', 'bad');
    try { await q(sb.from('settings').update(row).eq('id', 1)); toast('Shift settings saved'); route(); }
    catch (e) { toast(e.message, 'bad'); }
  };
  $$('[data-save-lt]', el).forEach(b => b.onclick = async () => {
    const tr = b.closest('tr'), id = tr.dataset.lt, row = {};
    $$('[data-k]', tr).forEach(i => row[i.dataset.k] = i.type === 'checkbox' ? i.checked : i.type === 'number' ? +i.value : i.value.trim());
    if (!row.name || !row.code) return toast('Enter a name and a code', 'bad');
    try {
      if (id === 'new') await q(sb.from('leave_types').insert(row)); else await q(sb.from('leave_types').update(row).eq('id', +id));
      toast(id === 'new' ? 'Leave type added' : 'Leave type saved'); route();
    } catch (e) { toast(e.message, 'bad'); }
  });
  $('#al-run').onclick = async () => {
    const y = +$('#al-year').value;
    try { const n = await q(sb.rpc('allot_leave_balances', { p_year: y })); toast(n ? `Added ${n} leave balances for ${y}` : `Everyone already has ${y} balances`); }
    catch (e) { toast(e.message, 'bad'); }
  };
  $('#h-form').onsubmit = async e => {
    e.preventDefault();
    try { await q(sb.from('holidays').insert({ holiday_date: $('#h-date').value, name: $('#h-name').value.trim() })); toast('Holiday added'); route(); }
    catch (err) { toast(err.code === '23505' ? 'A holiday already exists on that date' : err.message, 'bad'); }
  };
  $$('[data-del-h]', el).forEach(b => b.onclick = async () => {
    if (!confirm('Remove this holiday?')) return;
    try { await q(sb.from('holidays').delete().eq('id', +b.dataset.delH)); toast('Holiday removed'); route(); }
    catch (e) { toast(e.message, 'bad'); }
  });
};

/* ---------- Tasks & timer ---------- */
const PRIORITY = { high: ['bad', 'High'], medium: ['warn', 'Medium'], low: ['muted', 'Low'] };
const TSTATUS = { todo: 'To do', in_progress: 'In progress', review: 'Review', done: 'Done' };
const TCOLOR = { todo: '#8A94A6', in_progress: '#2D6CDF', review: '#B7791F', done: '#1E8A5A' };

VIEWS.tasks = async el => {
  const scope = isMgr() ? S.taskScope : 'mine', filter = S.taskFilter, today = istDate();
  let qb = sb.from('tasks').select('*').order('created_at', { ascending: false }).limit(150);
  qb = scope === 'mine' ? qb.eq('assigned_to', S.me.id) : qb.neq('assigned_to', S.me.id);
  if (filter === 'open') qb = qb.neq('status', 'done'); else if (filter === 'done') qb = qb.eq('status', 'done');
  const [tasks, todayLogs] = await Promise.all([
    q(qb),
    q(sb.from('time_logs').select('*').eq('employee_id', S.me.id).gte('started_at', `${today}T00:00:00+05:30`))
  ]);
  const logs = tasks.length ? await q(sb.from('time_logs').select('task_id,started_at,ended_at,minutes').in('task_id', tasks.map(t => t.id))) : [];
  const spent = id => logs.filter(l => l.task_id === id).reduce((s, l) => s + logMinutes(l), 0);
  const order = { in_progress: 0, review: 1, todo: 2, done: 3 };
  tasks.sort((a, b) => order[a.status] - order[b.status] || (a.due_date || '9999').localeCompare(b.due_date || '9999'));
  const overdue = tasks.filter(t => t.status !== 'done' && t.due_date && t.due_date < today).length;

  el.innerHTML = `<div class="toolbar">
      ${isMgr() ? `<div class="field"><label>View</label><div class="seg" role="tablist"><button data-scope="mine" class="${scope === 'mine' ? 'on' : ''}">My tasks</button><button data-scope="team" class="${scope === 'team' ? 'on' : ''}">Team tasks</button></div></div>` : ''}
      <div class="field"><label for="t-filter">Show</label><select id="t-filter"><option value="open" ${filter === 'open' ? 'selected' : ''}>Open tasks</option><option value="done" ${filter === 'done' ? 'selected' : ''}>Done</option><option value="all" ${filter === 'all' ? 'selected' : ''}>All</option></select></div>
      <div class="field grow"><label for="t-search">Search</label><input id="t-search" type="text" placeholder="Task, project or person"></div>
      <button class="btn primary" id="t-new">${icon('plus')}New task</button>
    </div>
    ${S.running ? `<div class="run-banner"><span class="rec"></span><div style="min-width:0"><small>Timer running</small><b>${esc(S.running.task?.title || 'Task')}</b>${S.running.task?.project ? `<div class="task-sub">${esc(S.running.task.project)}</div>` : ''}</div><b class="num big" data-live-timer>0:00:00</b><button class="btn danger" data-stop>${icon('stop')}Stop</button></div>` : ''}
    <div class="stats">
      <div class="stat"><span>Tracked today (you)</span><b>${hm(todayLogs.reduce((s, l) => s + logMinutes(l), 0))}</b></div>
      <div class="stat"><span>In progress</span><b>${tasks.filter(t => t.status === 'in_progress').length}</b></div>
      <div class="stat"><span>To do</span><b>${tasks.filter(t => t.status === 'todo').length}</b></div>
      <div class="stat"><span>Overdue</span><b>${overdue}</b></div>
    </div>
    <div class="card"><div class="table-wrap"><table><thead><tr><th>Task</th>${scope === 'team' ? '<th>Assigned to</th>' : ''}<th>Due</th><th>Priority</th><th>Status</th><th>Time</th><th></th></tr></thead>
    <tbody id="t-rows">${tasks.length ? tasks.map(t => {
      const mine = t.assigned_to === S.me.id, running = S.running?.task_id === t.id;
      const [pc, pl] = PRIORITY[t.priority] || PRIORITY.medium;
      return `<tr data-s="${esc((t.title + ' ' + projName(t) + ' ' + nameOf(t.assigned_to)).toLowerCase())}">
        <td style="white-space:normal;min-width:220px"><div class="task-title">${esc(t.title)}</div><div class="task-sub">${esc(projName(t) || 'No project')}</div></td>
        ${scope === 'team' ? `<td>${esc(nameOf(t.assigned_to))}</td>` : ''}
        <td class="num">${t.due_date ? `<span class="${t.status !== 'done' && t.due_date < today ? 'overdue' : ''}">${fmtShort(t.due_date)}</span>` : '<span class="muted">—</span>'}</td>
        <td><span class="pill ${pc}">${pl}</span></td>
        <td><select class="mini" data-status="${t.id}" aria-label="Status">${Object.entries(TSTATUS).map(([v, l]) => `<option value="${v}" ${t.status === v ? 'selected' : ''}>${l}</option>`).join('')}</select></td>
        <td class="num">${running ? '<b data-live-timer style="color:var(--bad)">0:00:00</b>' : hm(spent(t.id))}</td>
        <td style="text-align:right;white-space:nowrap">${mine && t.status !== 'done' ? (running ? `<button class="btn danger sm icon-btn" data-stop>${icon('stop')}Stop</button>` : `<button class="btn sm icon-btn" data-start="${t.id}">${icon('play')}Start</button>`) : ''} <button class="btn sm" data-edit="${t.id}">Edit</button></td></tr>`; }).join('')
      : `<tr><td colspan="7" class="empty">${filter === 'done' ? 'No finished tasks yet.' : 'No open tasks. Create one and press Start to track your time.'}</td></tr>`}</tbody></table></div></div>`;

  $$('[data-scope]', el).forEach(b => b.onclick = () => { S.taskScope = b.dataset.scope; route(); });
  $('#t-filter').onchange = e => { S.taskFilter = e.target.value; route(); };
  $('#t-search').oninput = e => { const v = e.target.value.toLowerCase(); $$('#t-rows tr[data-s]').forEach(r => r.style.display = r.dataset.s.includes(v) ? '' : 'none'); };
  $('#t-new').onclick = () => openTask(null);
  $$('[data-start]', el).forEach(b => b.onclick = () => startTimer(b.dataset.start));
  $$('[data-stop]', el).forEach(b => b.onclick = () => stopTimer());
  $$('[data-edit]', el).forEach(b => b.onclick = () => openTask(tasks.find(t => t.id === b.dataset.edit)));
  $$('[data-status]', el).forEach(sel => sel.onchange = async () => {
    try { await q(sb.from('tasks').update({ status: sel.value }).eq('id', sel.dataset.status)); toast(`Marked as ${TSTATUS[sel.value].toLowerCase()}`); await refreshRunning(); route(); }
    catch (e) { toast(e.message, 'bad'); }
  });
  paintTimer();
};

async function openTask(task, opts = {}) {
  const isNew = !task;
  const people = isMgr() ? S.profiles.filter(p => p.is_active) : [S.me];
  const t = task || { priority: 'medium', status: opts.status || 'todo', assigned_to: S.me.id, project_id: opts.projectId || null, checklist: [] };
  const canDelete = !isNew && (t.created_by === S.me.id || isMgr());
  const projects = S.projects.filter(p => p.status !== 'completed' || p.id === t.project_id);
  const logs = isNew ? [] : await q(sb.from('time_logs').select('*').eq('task_id', t.id).order('started_at', { ascending: false }).limit(50)).catch(() => []);
  let checklist = Array.isArray(t.checklist) ? t.checklist.map(x => ({ ...x })) : [];
  openModal({
    title: isNew ? 'New task' : 'Task',
    wide: true,
    body: `<div class="task-grid">
      <div>
        <div class="form-grid">
          <div class="field full"><label for="tk-title">Task</label><input id="tk-title" type="text" value="${esc(t.title || '')}" placeholder="e.g. Update homepage banner"></div>
          <div class="field"><label for="tk-project">Project</label><select id="tk-project"><option value="">No project</option>${projects.map(p => `<option value="${p.id}" ${p.id === t.project_id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>
          <div class="field"><label for="tk-who">Assigned to</label><select id="tk-who" ${people.length < 2 ? 'disabled' : ''}>${people.map(p => `<option value="${p.id}" ${p.id === t.assigned_to ? 'selected' : ''}>${esc(p.full_name || p.email)}${p.id === S.me.id ? ' (you)' : ''}</option>`).join('')}</select></div>
          <div class="field"><label for="tk-status">Status</label><select id="tk-status">${Object.entries(TSTATUS).map(([v, l]) => `<option value="${v}" ${t.status === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
          <div class="field"><label for="tk-pri">Priority</label><select id="tk-pri">${Object.entries(PRIORITY).map(([v, [, l]]) => `<option value="${v}" ${t.priority === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
          <div class="field"><label for="tk-due">Due date</label><input id="tk-due" type="date" value="${esc(t.due_date || '')}"></div>
          <div class="field">${isNew ? '' : `<label>Time logged</label><div style="padding:9px 0;font-weight:600">${hm(logs.reduce((s, l) => s + logMinutes(l), 0))}</div>`}</div>
          <div class="field full"><label for="tk-desc">Description</label><textarea id="tk-desc" placeholder="What needs to be done? Links, notes…">${esc(t.description || '')}</textarea></div>
        </div>
        <div class="section-h"><b>Checklist</b><span class="task-sub" id="ck-count"></span></div>
        <div class="ck-bar"><span id="ck-fill"></span></div>
        <div id="ck-list"></div>
        <div class="ck-add"><input id="ck-new" type="text" placeholder="Add an item and press Enter"><button class="btn sm" id="ck-add" type="button">${icon('plus')}Add</button></div>
        ${logs.length ? `<details style="margin-top:16px"><summary class="task-sub" style="cursor:pointer">Time log (${logs.length})</summary><div class="table-wrap" style="margin-top:8px;border:1px solid var(--line);border-radius:8px"><table><thead><tr><th>Who</th><th>Date</th><th>From – to</th><th>Time</th></tr></thead><tbody>${logs.map(l => `<tr><td>${esc(nameOf(l.employee_id))}</td><td>${fmtShort(istDate(new Date(l.started_at)))}</td><td class="num">${fmtTime(l.started_at)} – ${l.ended_at ? fmtTime(l.ended_at) : 'running'}</td><td class="num">${hm(logMinutes(l))}</td></tr>`).join('')}</tbody></table></div></details>` : ''}
      </div>
      <div class="task-side">
        <div class="section-h" style="margin-top:0"><b>Comments</b></div>
        ${isNew ? '<div class="muted" style="font-size:13px">Create the task first, then you can add comments.</div>' : '<div id="tk-comments"></div>'}
      </div>
    </div>`,
    footer: `${canDelete ? '<button class="btn danger" id="tk-del" style="margin-right:auto">Delete task</button>' : ''}<button class="btn" data-close>${isNew ? 'Cancel' : 'Close'}</button><button class="btn primary" id="tk-save">${isNew ? 'Create task' : 'Save changes'}</button>`,
    onMount: (root, close) => {
      let changed = false;
      const renderCk = () => {
        const done = checklist.filter(x => x.done).length;
        $('#ck-count', root).textContent = checklist.length ? `${done} of ${checklist.length} done` : 'Break the task into small steps';
        $('#ck-fill', root).style.width = checklist.length ? `${done / checklist.length * 100}%` : '0';
        $('#ck-list', root).innerHTML = checklist.map((x, i) => `<div class="ck-item ${x.done ? 'done' : ''}"><label><input type="checkbox" data-ck="${i}" ${x.done ? 'checked' : ''}><span>${esc(x.text)}</span></label><button class="btn link" data-ckdel="${i}" aria-label="Remove item">Remove</button></div>`).join('');
        $$('[data-ck]', root).forEach(c => c.onchange = () => { checklist[+c.dataset.ck].done = c.checked; renderCk(); saveCk(); });
        $$('[data-ckdel]', root).forEach(b => b.onclick = () => { checklist.splice(+b.dataset.ckdel, 1); renderCk(); saveCk(); });
      };
      const saveCk = async () => {
        if (isNew) return;
        try { await q(sb.from('tasks').update({ checklist }).eq('id', t.id)); t.checklist = checklist.map(x => ({ ...x })); changed = true; }
        catch (e) { toast(e.message, 'bad'); }
      };
      const addCk = () => { const inp = $('#ck-new', root), v = inp.value.trim(); if (!v) return; checklist.push({ text: v, done: false }); inp.value = ''; renderCk(); saveCk(); inp.focus(); };
      $('#ck-add', root).onclick = addCk;
      $('#ck-new', root).addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addCk(); } });
      renderCk();
      if (!isNew) mountComments($('#tk-comments', root), { taskId: t.id, projectId: t.project_id || null });

      const finish = () => { close(); if (changed) route(); };
      $('[data-close]', root).onclick = finish;
      $('#tk-save', root).onclick = async () => {
        const v = id => $(id, root)?.value.trim();
        const pid = v('#tk-project') || null;
        const row = { title: v('#tk-title'), project_id: pid, project: S.projects.find(p => p.id === pid)?.name || null, assigned_to: v('#tk-who') || S.me.id, status: v('#tk-status'), due_date: v('#tk-due') || null, priority: v('#tk-pri'), description: v('#tk-desc') || null, checklist };
        if (!row.title) return toast('Enter a task name', 'bad');
        try {
          if (isNew) await q(sb.from('tasks').insert({ ...row, created_by: S.me.id }));
          else await q(sb.from('tasks').update(row).eq('id', t.id));
          close(); toast(isNew ? 'Task created' : 'Task saved'); await refreshRunning(); route();
        } catch (e) { toast(e.message, 'bad'); }
      };
      $('#tk-del', root) && ($('#tk-del', root).onclick = async () => {
        if (!confirm('Delete this task, its comments and time logs?')) return;
        try { await q(sb.from('tasks').delete().eq('id', t.id)); close(); toast('Task deleted'); await refreshRunning(); route(); }
        catch (e) { toast(e.message, 'bad'); }
      });
    }
  });
}

/* ---------- Boot ---------- */
(async function boot() {
  if (!configured) return renderSetup();
  const isRecovery = location.hash.includes('type=recovery');
  sb.auth.onAuthStateChange(evt => {
    if (evt === 'PASSWORD_RECOVERY') setTimeout(renderResetPassword, 0);
    if (evt === 'SIGNED_OUT') { S.me = null; S.shell = false; setTimeout(renderLogin, 0); }
  });
  if (isRecovery) return;
  const { data: { session } } = await sb.auth.getSession();
  session ? startApp() : renderLogin();
})();
</script>
</body>
</html>
