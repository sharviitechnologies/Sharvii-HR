<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sharvii People</title>
<link rel="icon" href="https://sharviitechnologies.com/wp-content/uploads/2026/01/cropped-ST-logo-270x270.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Merriweather:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#1E4FA3;
  --brand-ink:#ffffff;
  --brand-soft:color-mix(in srgb, var(--brand) 9%, #ffffff);
  --brand-line:color-mix(in srgb, var(--brand) 22%, #ffffff);
  --ink:#1B2430; --ink-2:#4A5565; --ink-3:#7A8494;
  --line:#E3E7EC; --canvas:#F4F6F8; --surface:#ffffff;
  --ok:#1E8A5A; --ok-soft:#E4F4EB;
  --warn:#A3650E; --warn-soft:#FCF1DE;
  --bad:#B53A2B; --bad-soft:#FBE8E5;
  --muted-soft:#EEF0F3;
  --info:#2D6CDF; --info-soft:#E7EFFC;
  --side:240px;
  --navy:#131C3F;
  --navy-2:#1C2752;
  --green-light:#6CC17A;
  --logo-bg:var(--navy);
  --serif:'Merriweather',Georgia,'Times New Roman',serif;
  font-family:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  color:var(--ink); font-size:15px; line-height:1.5;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--canvas)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.ic{width:20px;height:20px;flex:none}
.num{font-variant-numeric:tabular-nums}

/* ---------- Layout ---------- */
.layout{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:18px 20px;background:var(--logo-bg)}
.brand img{height:38px;max-width:170px;object-fit:contain}
.brand-fallback{display:none;width:34px;height:34px;border-radius:8px;background:var(--brand);color:var(--brand-ink);font-weight:700;align-items:center;justify-content:center}
.brand-name{font-weight:700;font-size:14px;line-height:1.2}
.brand-name small{display:block;font-weight:500;color:var(--ink-3);font-size:12px}
.nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--canvas);color:var(--ink)}
.nav a.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav .badge{margin-left:auto}
.side-foot{padding:14px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3)}
.main{min-width:0;display:flex;flex-direction:column}
.top{height:64px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 28px;position:sticky;top:0;z-index:5}
.top h1{font-size:19px;margin:0;font-weight:700}
.top .today{color:var(--ink-3);font-size:13px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px;min-width:0}
.user{display:flex;align-items:center;gap:10px;background:none;border:1px solid transparent;border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer}
.user:hover{border-color:var(--line)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.user-text{text-align:left;line-height:1.2}
.user-text b{display:block;font-size:14px}
.user-text span{font-size:12px;color:var(--ink-3);text-transform:capitalize}
.content{padding:28px;max-width:1240px;width:100%}
.bottom-nav{display:none}

/* ---------- Building blocks ---------- */
.grid{display:grid;gap:20px}
.g-2{grid-template-columns:1.4fr 1fr}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.card-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:15px;margin:0;font-weight:700}
.card-h .sub{color:var(--ink-3);font-size:13px}
.card-h .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.card-b{padding:18px 20px}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:20px}
.toolbar .grow{flex:1}
.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,#fff)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.link{border:none;background:none;color:var(--brand);padding:0}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--ink-3)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=month],input[type=number],select,textarea{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
textarea{resize:vertical;min-height:80px}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.muted{background:var(--muted-soft);color:var(--ink-3)}
.badge{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px;min-width:20px;text-align:center}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12.5px;font-weight:600;color:var(--ink-3);padding:10px 16px;border-bottom:1px solid var(--line);background:#FAFBFC;white-space:nowrap}
td{padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.muted,.muted{color:var(--ink-3)}
td.num,td:first-child{white-space:nowrap}
.who{display:flex;align-items:center;gap:10px}
.who b{font-weight:600;display:block}
.who small{color:var(--ink-3);font-size:12.5px}
.empty{padding:36px 20px;text-align:center;color:var(--ink-3)}
.loading{padding:40px;text-align:center;color:var(--ink-3)}
.note{background:var(--brand-soft);border:1px solid var(--brand-line);border-radius:10px;padding:12px 14px;font-size:13.5px;color:var(--ink-2)}

/* ---------- Check-in panel (the signature element) ---------- */
.punch{background:var(--navy);color:#fff;border-radius:14px;padding:26px 28px;display:grid;grid-template-columns:1fr minmax(260px,340px);gap:28px;align-items:center;margin-bottom:20px}
.punch-date{font-size:14px;opacity:.85}
.punch-clock{font-size:clamp(38px,6vw,58px);font-weight:700;letter-spacing:-.02em;line-height:1.05;margin:4px 0 8px;font-variant-numeric:tabular-nums}
.punch-status{font-size:15px;opacity:.95}
.punch-date{color:var(--green-light);opacity:1!important;font-weight:600}
.punch-btn{width:100%;padding:14px;font-size:16px;border-radius:10px;background:var(--brand);color:#fff;border:none}
.punch-btn:hover{filter:brightness(1.08)}
.punch[data-state=in] .punch-btn{background:#fff;color:var(--bad)}
.punch[data-state=done] .punch-btn{background:rgba(255,255,255,.18);color:#fff;cursor:default}
.shift{margin-top:16px}
.shift-bar{height:8px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
.shift-bar span{display:block;height:100%;background:var(--green-light);border-radius:99px;transition:width .6s ease}
.shift-meta{display:flex;justify-content:space-between;font-size:12.5px;margin-top:8px;opacity:.9;font-variant-numeric:tabular-nums}
.shift-meta b{font-weight:700}

/* ---------- Stats & balances ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat span{font-size:13px;color:var(--ink-3)}
.stat b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.bal-list{display:flex;flex-direction:column}
.bal{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.bal:last-child{border-bottom:none}
.bal-name{font-weight:600}
.bal-left{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.bal-left small{font-weight:500;color:var(--ink-3)}
.bal-track{grid-column:1/-1;height:6px;border-radius:99px;background:var(--muted-soft);overflow:hidden;display:flex}
.bal-track .u{background:var(--brand)}
.bal-track .p{background:color-mix(in srgb,var(--brand) 40%,#fff)}
.bal-meta{grid-column:1/-1;font-size:12.5px;color:var(--ink-3)}
.list-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:none}
.date-chip{width:46px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:3px 0;line-height:1.15;flex:none}
.date-chip b{display:block;font-size:17px}
.date-chip small{font-size:11px;color:var(--ink-3)}

/* ---------- Tasks & timer ---------- */
.timer-pill{display:inline-flex;align-items:center;gap:8px;background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:6px 14px;text-decoration:none;font-size:13px;font-weight:600;max-width:340px;min-width:0}
.timer-pill .tp-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-weight:500}
.rec{width:8px;height:8px;border-radius:50%;background:var(--bad);flex:none;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.run-banner{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:12px;padding:16px 20px;margin-bottom:20px}
.run-banner small{display:block;color:var(--ink-3);font-size:12.5px}
.run-banner .big{margin-left:auto;font-size:28px;font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:none;background:none;padding:8px 14px;font-weight:600;color:var(--ink-3);cursor:pointer}
.seg button.on{background:var(--brand-soft);color:var(--brand)}
.task-title{font-weight:600}
.task-sub{font-size:12.5px;color:var(--ink-3)}
.overdue{color:var(--bad);font-weight:600}
select.mini{width:auto;padding:5px 8px;font-size:13px}
.icon-btn{padding:6px 10px}
.icon-btn .ic{width:16px;height:16px}

/* ---------- People ---------- */
.plink{color:inherit;text-decoration:none}
.plink:hover b{color:var(--brand);text-decoration:underline}
.avatar.lg{width:64px;height:64px;font-size:22px}
.avatar.sm{width:24px;height:24px;font-size:10px}
.person-head{display:flex;align-items:center;gap:18px;padding:20px 22px;flex-wrap:wrap;margin-bottom:20px}
.person-head h2{margin:0;font-size:22px}
.person-head .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 24px;margin:0}
.facts dt{font-size:12.5px;color:var(--ink-3);font-weight:600}
.facts dd{margin:3px 0 0;word-break:break-word}
.facts a{color:var(--brand)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:14px;margin-bottom:14px}
.back:hover{color:var(--brand)}

/* ---------- Attendance register ---------- */
.month-nav{display:flex;align-items:center;gap:6px}
.month-nav b{min-width:150px;text-align:center;font-size:16px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--ink-2);padding:12px 16px;border-bottom:1px solid var(--line);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.reg{border-collapse:separate;border-spacing:0;font-size:12.5px;width:auto}
.reg th,.reg td{padding:0;text-align:center;border-bottom:1px solid var(--line);border-right:1px solid var(--line);min-width:32px;height:36px;background:#fff}
.reg th{font-size:11px;line-height:1.25;padding:5px 0;background:#FAFBFC;color:var(--ink-3)}
.reg th b{display:block;color:var(--ink);font-size:12px}
.reg .namec{position:sticky;left:0;z-index:2;text-align:left;padding:0 14px;min-width:180px;white-space:nowrap}
.reg th.namec{z-index:3}
.reg td.off,.reg th.off{background:#F5F6F8}
.reg td.today,.reg th.today{box-shadow:inset 0 0 0 2px var(--brand)}
.reg .tot{font-weight:700;min-width:52px;background:#FAFBFC;padding:0 6px}
.code{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;padding:0 3px;border-radius:5px;font-weight:700;font-size:11px}
.c-P{background:var(--ok-soft);color:var(--ok)}
.c-LT{background:var(--warn-soft);color:var(--warn)}
.c-M{background:var(--bad);color:#fff}
.c-A{background:var(--bad-soft);color:var(--bad)}
.c-L,.c-HD{background:var(--info-soft);color:var(--info)}
.c-H{color:#8A6D1E}
.c-WO{color:var(--ink-3);font-weight:600}

/* ---------- Projects ---------- */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.proj{display:block;background:#fff;border:1px solid var(--line);border-top:4px solid var(--pc);border-radius:12px;padding:16px 18px;text-decoration:none;color:inherit;transition:box-shadow .15s}
.proj:hover{box-shadow:0 8px 22px rgba(20,28,40,.09)}
.proj-top{display:flex;align-items:center;gap:8px}
.proj-top b{font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog{height:6px;border-radius:99px;background:var(--muted-soft);overflow:hidden;margin:14px 0 8px}
.prog span{display:block;height:100%;background:var(--pc,var(--brand));border-radius:99px}
.proj-meta{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink-3)}
.avs{display:flex;margin-top:12px;min-height:26px}
.avs .avatar{width:26px;height:26px;font-size:10px;border:2px solid #fff;margin-left:-6px}
.avs .avatar:first-child{margin-left:0}
.proj-head{border-left:6px solid var(--pc);padding:18px 22px;margin-bottom:20px;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.proj-head h2{margin:0 0 4px;font-size:21px}
.proj-head .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.board{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:#ECEFF3;border-radius:12px;padding:10px;min-height:220px;display:flex;flex-direction:column;gap:8px}
.col.drop{outline:2px dashed var(--brand);outline-offset:-2px;background:var(--brand-soft)}
.col-h{display:flex;align-items:center;gap:8px;padding:4px 4px 6px;font-weight:700;font-size:13px}
.col-h .dot{width:9px;height:9px;border-radius:50%}
.col-h .n{color:var(--ink-3);font-weight:600}
.col-h .btn{margin-left:auto;padding:3px 8px}
.tcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.tcard:hover{border-color:var(--ink-3)}
.tcard.dragging{opacity:.45}
.tcard-meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.tcard-meta .sp{flex:1}
.sw{width:28px;height:28px;border-radius:50%;display:inline-block;position:relative;cursor:pointer}
.sw input{position:absolute;opacity:0;inset:0;cursor:pointer}
.sw:has(input:checked){outline:3px solid var(--ink);outline-offset:2px}
.swatches{display:flex;gap:10px;flex-wrap:wrap;padding:4px 2px}

/* ---------- Task detail, checklist, comments ---------- */
.dialog.wide{width:min(980px,100%)}
.task-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px}
.task-side{border-left:1px solid var(--line);padding-left:24px;display:flex;flex-direction:column;min-height:0}
.section-h{display:flex;align-items:baseline;gap:10px;margin:20px 0 8px}
.ck-bar{height:5px;border-radius:99px;background:var(--muted-soft);overflow:hidden;margin-bottom:6px}
.ck-bar span{display:block;height:100%;background:var(--brand);transition:width .3s}
.ck-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.ck-item label{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;min-width:0}
.ck-item input{width:16px;height:16px;accent-color:var(--brand);flex:none}
.ck-item.done span{text-decoration:line-through;color:var(--ink-3)}
.ck-item .btn.link{font-size:12.5px;color:var(--ink-3)}
.ck-add{display:flex;gap:8px;margin-top:8px}
.cm-list{display:flex;flex-direction:column;gap:14px;max-height:380px;overflow-y:auto;padding-right:4px;margin-bottom:12px}
.cm{display:flex;gap:10px}
.cm-body{flex:1;min-width:0;background:var(--canvas);border-radius:10px;padding:8px 12px}
.cm-h{display:flex;align-items:baseline;gap:8px;font-size:13px}
.cm-h .muted{font-size:12px}
.cm-del{margin-left:auto;font-size:12px;color:var(--ink-3)!important}
.cm-text{white-space:pre-wrap;word-break:break-word;font-size:14px;margin-top:2px}
.cm-new{display:flex;gap:8px;align-items:flex-start}
.cm-new textarea{min-height:44px;flex:1}
.stack{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--muted-soft);margin:10px 0 8px}
.stack span{display:block;height:100%}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.tcard-meta .ic{width:14px;height:14px;vertical-align:-2px;margin-right:2px}
.task-sub .ic{width:13px;height:13px;vertical-align:-2px}
.nudge{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:12px;padding:14px 18px;margin-bottom:20px}
.nudge .btn{margin-left:auto}

/* ---------- Approvals ---------- */
.req{padding:18px 20px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:14px}
.req:last-child{border-bottom:none}
.req-meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--ink-2);margin-top:6px}
.req-reason{margin-top:8px;font-size:14px;color:var(--ink-2)}
.req-act{display:flex;flex-direction:column;gap:8px;min-width:230px}
.req-act .row{display:flex;gap:8px}
.req-act .row .btn{flex:1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs button{border:none;background:none;padding:10px 14px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}

/* ---------- Modal & toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,28,40,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.dialog{background:#fff;border-radius:14px;width:min(560px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(20,28,40,.25)}
.dialog-h{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.dialog-h h3{margin:0;font-size:17px}

.quote p{font-family:var(--serif);font-style:italic;font-size:17px;line-height:1.6;opacity:.95!important}
.quote cite{display:block;margin-top:8px;font-style:normal;font-size:13px;color:var(--green-light)}

CONFIG.SUPABASE_URL = String(CONFIG.SUPABASE_URL).replace(/[^\x21-\x7E]/g, '').replace(/[‘’“”'"]/g, '').replace(/\/+$/, '');
CONFIG.SUPABASE_ANON_KEY = String(CONFIG.SUPABASE_ANON_KEY).replace(/[^\x21-\x7E]/g, '').replace(/[‘’“”'"]/g, '');

const TZ = CONFIG.TIMEZONE;

/* ---------- Helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const istDate = (d = new Date()) => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
const fmtTime = ts => ts ? new Date(ts).toLocaleTimeString('en-IN', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: true }) : '—';
const dObj = d => new Date(d + 'T00:00:00');
const fmtDate = d => d ? dObj(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
const fmtShort = d => d ? dObj(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) : '—';
const dayName = d => dObj(d).toLocaleDateString('en-IN', { weekday: 'short' });
const fmtRange = (a, b) => a === b ? fmtDate(a) : `${fmtShort(a)} – ${fmtDate(b)}`;
const dur = ms => { if (!ms || ms < 0) return '0h 00m'; const m = Math.floor(ms / 60000); return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m`; };
const num = n => (Math.round(Number(n || 0) * 10) / 10).toString();
const initials = n => (n || '?').trim().split(/\s+/).slice(0, 2).map(x => x[0]).join('').toUpperCase();
const isAdmin = () => S.me?.role === 'admin';
const isMgr = () => S.me?.role === 'manager' || isAdmin();
const nameOf = id => S.profiles.find(p => p.id === id)?.full_name || S.profiles.find(p => p.id === id)?.email || 'Unknown';
const profileOf = id => S.profiles.find(p => p.id === id) || {};
const typeName = id => S.leaveTypes.find(t => t.id === id)?.name || 'Leave';
const monthBounds = ym => { const [y, m] = ym.split('-').map(Number); const last = new Date(y, m, 0).getDate(); return { first: `${ym}-01`, last: `${ym}-${String(last).padStart(2, '0')}`, days: last }; };
async function q(p) { const { data, error } = await p; if (error) throw error; return data; }

/* Shift & working-day helpers (settings come from the database) */
const DEFAULT_SETTINGS = { shift_start: '09:30:00', shift_end: '18:30:00', checkin_opens: '08:30:00', checkin_closes: '11:00:00', checkout_closes: '23:00:00', late_grace_minutes: 10, saturday_rule: 'second', tracking_start: '2026-10-07' };
S.settings = { ...DEFAULT_SETTINGS };
const pad2 = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const addDays = (date, n) => { const d = dObj(date); d.setDate(d.getDate() + n); return ymd(d); };
const toMin = t => { const [h, m] = String(t || '0:0').split(':').map(Number); return h * 60 + (m || 0); };
const istMin = (d = new Date()) => { const [h, m] = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(d).split(':'); return +h * 60 + +m; };
const istHM = ts => ts ? new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date(ts)) : '';
const fmtClock = t => { const m = typeof t === 'number' ? t : toMin(t), h = Math.floor(m / 60); return `${h % 12 || 12}:${pad2(m % 60)} ${h < 12 ? 'AM' : 'PM'}`; };
const shiftHours = () => (toMin(S.settings.shift_end) - toMin(S.settings.shift_start)) / 60;
function offReason(date) {
  const h = S.holidays.find(x => x.holiday_date === date); if (h) return h.name;
  const d = dObj(date), dow = d.getDay(), wk = Math.floor((d.getDate() - 1) / 7), r = S.settings.saturday_rule;
  if (dow === 0) return 'Sunday';
  if (dow === 6 && (r === 'all' || (r === 'second' && wk === 1) || (r === 'second_fourth' && (wk === 1 || wk === 3)))) return wk === 1 ? '2nd Saturday' : wk === 3 ? '4th Saturday' : 'Saturday off';
  return null;
}
const trackFrom = p => [S.settings.tracking_start, p?.date_of_joining || ''].sort().pop();
const lateBy = a => istMin(new Date(a.check_in)) - toMin(S.settings.shift_start);
const isLate = a => !!a?.check_in && lateBy(a) > Number(S.settings.late_grace_minutes || 0);
const isMissed = (a, date) => !!a?.check_in && !a.check_out && (date < istDate() || (date === istDate() && istMin() >= toMin(S.settings.checkout_closes)));
const hms = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(s / 3600)}:${pad2(Math.floor(s / 60) % 60)}:${pad2(s % 60)}`; };
const hm = mins => { const m = Math.round(mins || 0); return `${Math.floor(m / 60)}h ${pad2(m % 60)}m`; };
async function allRows(make) { const out = []; for (let f = 0; ; f += 1000) { const d = await q(make().range(f, f + 999)); out.push(...d); if (d.length < 1000) break; } return out; }
async function inChunks(ids, make) { const out = []; for (let i = 0; i < ids.length; i += 100) out.push(...await q(make(ids.slice(i, i + 100)))); return out; }
const projName = t => S.projects.find(p => p.id === t.project_id)?.name || t.project || '';
const personLink = (p, sub = '') => `<a class="plink who" href="#/person/${p.id}"><span class="avatar">${esc(initials(p.full_name || p.email))}</span><div><b>${esc(p.full_name || p.email)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</div></a>`;
function dayCode(p, date, a, lv) {
  const today = istDate();
  if (date > today || date < trackFrom(p)) return '';
  if (a?.check_in) return isMissed(a, date) ? 'M' : isLate(a) ? 'LT' : 'P';
  if (lv) return lv.half_day ? 'HD' : 'L';
  if (offReason(date)) return S.holidays.some(h => h.holiday_date === date) ? 'H' : 'WO';
  return date === today ? '' : 'A';
}
const CODES = { P: 'Present', LT: 'Late', M: 'Missed check-out (leave)', L: 'Leave', HD: 'Half-day leave', A: 'Absent', H: 'Holiday', WO: 'Weekly off' };
function registerFor(people, dates, att, leaves) {
  const aMap = new Map(att.map(a => [a.employee_id + '|' + a.work_date, a]));
  return people.map(p => {
    const myLv = leaves.filter(l => l.employee_id === p.id && l.status === 'approved');
    const tot = { P: 0, LT: 0, M: 0, L: 0, HD: 0, A: 0, H: 0, WO: 0 }; let hours = 0, lateMin = 0;
    const cells = dates.map(date => {
      const a = aMap.get(p.id + '|' + date), lv = myLv.find(l => l.start_date <= date && l.end_date >= date);
      const c = dayCode(p, date, a, lv);
      if (c) tot[c]++;
      if (a?.hours_worked && c !== 'M') hours += Number(a.hours_worked);
      if (c === 'LT') lateMin += lateBy(a);
      return { date, c, a, lv };
    });
    const working = cells.filter(x => x.c && x.c !== 'H' && x.c !== 'WO').length;
    return { p, cells, tot, hours, lateMin, working, present: tot.P + tot.LT, leave: tot.L + tot.HD * 0.5 + tot.M };
  });
}
async function getDetails(id) { try { return (await q(sb.from('employee_details').select('*').eq('employee_id', id).maybeSingle())) || {}; } catch { return {}; } }
const detailFields = d => `
  <div class="field"><label for="d-phone">Phone</label><input id="d-phone" type="tel" value="${esc(d.phone || '')}" placeholder="+91 98xxx xxxxx"></div>
  <div class="field"><label for="d-pemail">Personal email</label><input id="d-pemail" type="email" value="${esc(d.personal_email || '')}"></div>
  <div class="field"><label for="d-dob">Date of birth</label><input id="d-dob" type="date" value="${esc(d.date_of_birth || '')}"></div>
  <div class="field"><label for="d-emerg">Emergency contact</label><input id="d-emerg" type="text" value="${esc(d.emergency_contact || '')}" placeholder="Name, relation, phone"></div>
  <div class="field full"><label for="d-addr">Address</label><textarea id="d-addr" style="min-height:60px">${esc(d.address || '')}</textarea></div>`;
async function saveDetails(id, root) {
  const v = s => $(s, root).value.trim() || null;
  await q(sb.from('employee_details').upsert({ employee_id: id, phone: v('#d-phone'), personal_email: v('#d-pemail'), date_of_birth: v('#d-dob'), emergency_contact: v('#d-emerg'), address: v('#d-addr'), updated_at: new Date().toISOString() }));
}
const logMinutes = l => l.ended_at ? Number(l.minutes || 0) : (Date.now() - new Date(l.started_at)) / 60000;

function teamList() {
  if (isAdmin()) return S.profiles.filter(p => p.is_active);
  return S.profiles.filter(p => p.is_active && (p.manager_id === S.me.id || p.id === S.me.id));
}

function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  el.className = 't ' + type; el.textContent = msg;
  $('#toast').appendChild(el);
  setTimeout(() => el.remove(), 3800);
}

function statusPill(s) {
  const map = { pending: ['warn', 'Pending'], approved: ['ok', 'Approved'], rejected: ['bad', 'Rejected'], cancelled: ['muted', 'Cancelled'] };
  const [c, t] = map[s] || ['muted', s];
  return `<span class="pill ${c}">${t}</span>`;
}

function logoFail(img) {

/* ---------- Modal ---------- */
function openModal({ title, body, footer = '', onMount, wide = false }) {
  const root = $('#modal-root');
  root.innerHTML = `<div class="overlay" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="dialog${wide ? ' wide' : ''}"><div class="dialog-h"><h3>${esc(title)}</h3><button class="x" aria-label="Close">&times;</button></div>
    <div class="dialog-b">${body}</div>${footer ? `<div class="dialog-f">${footer}</div>` : ''}</div></div>`;
  const close = () => { root.innerHTML = ''; document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  $('.x', root).onclick = close;
  $('.overlay', root).addEventListener('mousedown', e => { if (e.target.classList.contains('overlay')) close(); });
  onMount && onMount(root, close);
  const first = $('input,select,textarea', root); first && first.focus();
  return close;
}

function renderLogin() {
  clearInterval(S.clockTimer);
  $('#app').innerHTML = authShell(`<form id="login" novalidate>
      <h1>Sign in</h1><p class="lead">Use the email your HR admin added you with.</p>
      <div class="field"><label for="em">Work email</label><input id="em" type="email" autocomplete="email" required></div>
      <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
      <div class="err" id="err"></div>
      <button class="btn primary" type="submit" style="padding:11px">Sign in</button>

    </form>`);
  $('#login').onsubmit = async e => {
    e.preventDefault();
    const btn = $('button[type=submit]', e.target); btn.disabled = true; btn.textContent = 'Signing in…';
    let error; try { ({ error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim().toLowerCase(), password: $('#pw').value })); } catch (e) { error = e; }

      const m = error.message || '';
      $('#err').textContent = m === 'Invalid login credentials' ? 'Email or password is incorrect.'
        : /pattern|Invalid API key|fetch|Failed/i.test(m) ? 'The app can\u2019t reach the database. Check SUPABASE_URL and SUPABASE_ANON_KEY at the top of index.html.' : m;
      btn.disabled = false; btn.textContent = 'Sign in'; return;
    }
    await startApp();

  $('#forgot').onclick = async () => {

  };
}

const VIEWS = {};

function getLocation() {
  return new Promise(res => {
    if (!navigator.geolocation) return res({});
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lng: p.coords.longitude }),
      () => res({}), { timeout: 6000, maximumAge: 60000, enableHighAccuracy: false });
  });
}

function balanceRows(bals, pending, year) {
  if (!bals.length) return `<div class="empty">No leave balance for ${year} yet. Your HR admin adds it at the start of the year.</div>`;
  return `<div class="bal-list">${bals.map(b => {
    const pend = pending.filter(r => r.leave_type_id === b.leave_type_id && r.start_date.startsWith(year)).reduce((s, r) => s + Number(r.days), 0);
    const total = Number(b.allotted) || 0, used = Number(b.used) || 0, left = total - used - pend;
    const pu = total ? Math.min(100, used / total * 100) : 0, pp = total ? Math.min(100 - pu, pend / total * 100) : 0;
    return `<div class="bal"><span class="bal-name">${esc(typeName(b.leave_type_id))}</span>
      <span class="bal-left">${num(left)} <small>of ${num(total)} days left</small></span>
      <div class="bal-track"><span class="u" style="width:${pu}%"></span><span class="p" style="width:${pp}%"></span></div>
      <span class="bal-meta">${num(used)} used${pend ? ` · ${num(pend)} awaiting approval` : ''}</span></div>`;
  }).join('')}</div>`;
}

VIEWS.attendance = async el => {
  const month = S.attMonth || istDate().slice(0, 7);
  const team = isMgr() ? teamList() : [];
  const who = S.attWho && team.some(p => p.id === S.attWho) ? S.attWho : S.me.id;
  el.innerHTML = `<div class="toolbar">
      <div class="field"><label for="a-month">Month</label><input id="a-month" type="month" value="${month}" max="${istDate().slice(0, 7)}"></div>
      ${team.length > 1 ? `<div class="field" style="min-width:220px"><label for="a-who">Employee</label><select id="a-who">${team.map(p => `<option value="${p.id}" ${p.id === who ? 'selected' : ''}>${esc(p.full_name || p.email)}${p.id === S.me.id ? ' (you)' : ''}</option>`).join('')}</select></div>` : ''}
    </div><div id="a-body"><div class="loading">Loading…</div></div>`;
  $('#a-month').onchange = e => { S.attMonth = e.target.value; route(); };
  $('#a-who') && ($('#a-who').onchange = e => { S.attWho = e.target.value; route(); });

  const { first, last, days } = monthBounds(month);
  const [att, leaves] = await Promise.all([
    q(sb.from('attendance').select('*').eq('employee_id', who).gte('work_date', first).lte('work_date', last)),
    q(sb.from('leave_requests').select('*').eq('employee_id', who).eq('status', 'approved').lte('start_date', last).gte('end_date', first))
  ]);
  const today = istDate(), from = trackFrom(profileOf(who));
  const rows = [];
  let present = 0, totalH = 0, leaveDays = 0, absent = 0, late = 0, missed = 0;
  for (let d = days; d >= 1; d--) {
    const date = `${month}-${pad2(d)}`;
    if (date > today || date < from) continue;
    const a = att.find(x => x.work_date === date);
    const lv = leaves.find(x => x.start_date <= date && x.end_date >= date);
    const off = offReason(date);
    let st;
    if (a?.check_in) {
      if (isMissed(a, date)) { missed++; st = '<span class="pill bad">Leave (missed check-out)</span>'; }
      else {
        present++; totalH += Number(a.hours_worked || 0);
        st = a.check_out ? '<span class="pill ok">Present</span>' : '<span class="pill info">Working</span>';
        if (isLate(a)) { late++; st += ` <span class="pill warn">Late ${lateBy(a)} min</span>`; }
      }

/* ---------- Reports ---------- */
function downloadCSV(name, rows) {
  const csv = rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- Excel / CSV export (attendance only) ---------- */
async function loadXLSX() {
  if (window.XLSX) return;
  await new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = res; sc.onerror = () => rej(new Error('Could not load the Excel tool. Check your internet and try again.'));
    document.head.appendChild(sc);
  });
}
function xsheet(rows, widths) { const ws = XLSX.utils.aoa_to_sheet(rows); if (widths) ws['!cols'] = widths.map(w => ({ wch: w })); return ws; }
const datesBetween = (a, b) => { const out = []; for (let d = a; d <= b; d = addDays(d, 1)) out.push(d); return out; };
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

function attendanceRows(reg) {
  const today = istDate(), rows = [];
  const dates = reg[0]?.cells.map(c => c.date).filter(d => d <= today) || [];
  dates.forEach(d => reg.forEach(r => {
    const c = r.cells.find(x => x.date === d); if (!c || !c.c) return;
    rows.push([d, dayName(d), r.p.employee_code || '', r.p.full_name || r.p.email, CODES[c.c] + (c.c === 'H' || c.c === 'WO' ? ` (${offReason(d)})` : ''),
      c.a ? fmtTime(c.a.check_in) : '', c.a?.check_out ? fmtTime(c.a.check_out) : '', c.a?.hours_worked ?? '', c.c === 'LT' ? lateBy(c.a) : '', c.lv ? typeName(c.lv.leave_type_id) : '', c.a?.notes || '']);
  }));
  return [['Date', 'Day', 'Employee ID', 'Name', 'Status', 'Check in', 'Check out', 'Hours', 'Late (min)', 'Leave type', 'Note'], ...rows];
}
function summaryRows(reg) {
  return [['Employee ID', 'Name', 'Designation', 'Working days', 'Present', 'Late days', 'Late minutes', 'Missed check-out (leave)', 'Leave days', 'Absent', 'Hours worked', 'Avg hours / day'],
    ...reg.map(r => [r.p.employee_code || '', r.p.full_name || r.p.email, r.p.designation || '', r.working, r.present, r.tot.LT, r.lateMin, r.tot.M, r.leave, r.tot.A, +r.hours.toFixed(2), r.present ? +(r.hours / r.present).toFixed(2) : 0])];
}

async function exportAttendance(fmt, reg, mode, label) {
  const name = `Sharvii-Attendance-${label.replace(/[^A-Za-z0-9]+/g, '-')}`;
  if (fmt === 'csv') return downloadCSV(`${name}.csv`, attendanceRows(reg));
  await loadXLSX();
  const wb = XLSX.utils.book_new(), today = istDate();
  XLSX.utils.book_append_sheet(wb, xsheet([[`${CONFIG.COMPANY}: attendance ${label}`], [], ...summaryRows(reg)], [12, 22, 20, 13, 9, 10, 12, 22, 11, 9, 13, 14]), 'Summary');
  if (mode === 'month') {
    const dates = reg[0]?.cells.map(c => c.date).filter(d => d <= today) || [];
    XLSX.utils.book_append_sheet(wb, xsheet([
      ['Name', ...dates.map(d => `${dObj(d).getDate()} ${dayName(d)}`), 'Present', 'Late', 'Leave', 'Absent', 'Hours'],
      ...reg.map(r => [r.p.full_name || r.p.email, ...r.cells.filter(c => c.date <= today).map(c => c.c), r.present, r.tot.LT, r.leave, r.tot.A, +r.hours.toFixed(2)]),
      [], ['P = Present, LT = Late, M = Missed check-out (counted as leave), L = Leave, HD = Half-day leave, A = Absent, H = Holiday, WO = Weekly off']
    ], [22, ...dates.map(() => 7), 9, 7, 7, 8, 8]), 'Register');
  } else {
    XLSX.utils.book_append_sheet(wb, xsheet([
      ['Name', ...MONTHS.map(m => `${m} present`), 'Total present', 'Late', 'Leave', 'Absent'],
      ...reg.map(r => [r.p.full_name || r.p.email, ...MONTHS.map((_, i) => r.cells.filter(c => +c.date.slice(5, 7) === i + 1 && (c.c === 'P' || c.c === 'LT')).length), r.present, r.tot.LT, r.leave, r.tot.A])
    ], [22, ...MONTHS.map(() => 12), 13, 7, 7, 8]), 'By month');
  }
  XLSX.utils.book_append_sheet(wb, xsheet(attendanceRows(reg), [11, 6, 12, 22, 26, 10, 10, 8, 10, 14, 30]), 'Daily attendance');
  XLSX.writeFile(wb, `${name}.xlsx`);
}

async function downloadBackup() {
  const tables = ['profiles', 'employee_details', 'settings', 'holidays', 'leave_types', 'leave_balances', 'leave_requests', 'attendance', 'projects', 'tasks', 'comments', 'time_logs'];
  const data = { app: CONFIG.APP_NAME, created_at: new Date().toISOString(), tables: {} };
  for (const t of tables) data.tables[t] = await allRows(() => sb.from(t).select('*')).catch(() => []);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' }));
  a.download = `sharvii-hr-backup-${istDate()}.json`; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- Comments (tasks and projects) ---------- */
function timeAgo(ts) {
  const s = (Date.now() - new Date(ts)) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
  if (s < 7 * 86400) return `${Math.floor(s / 86400)} d ago`;
  return fmtDate(istDate(new Date(ts)));
}
async function mountComments(box, ref) {
  // ref: { taskId, projectId }  — task comments carry the projectId too, project discussion has no taskId
  box.innerHTML = `<div class="cm-list"><div class="muted" style="font-size:13px">Loading comments…</div></div>
    <div class="cm-new"><span class="avatar sm">${esc(initials(S.me.full_name || S.me.email))}</span>
      <textarea placeholder="Write a comment… (Ctrl + Enter to send)" aria-label="Write a comment"></textarea>
      <button class="btn primary sm" type="button">Comment</button></div>`;
  const list = $('.cm-list', box), ta = $('textarea', box), btn = $('.cm-new .btn', box);
  const load = async () => {
    let qb = sb.from('comments').select('*').order('created_at');
    qb = ref.taskId ? qb.eq('task_id', ref.taskId) : qb.eq('project_id', ref.projectId).is('task_id', null);
    const rows = await q(qb).catch(() => []);
    list.innerHTML = rows.length ? rows.map(c => `<div class="cm"><span class="avatar sm">${esc(initials(nameOf(c.author_id)))}</span><div class="cm-body">
        <div class="cm-h"><b>${esc(nameOf(c.author_id))}</b><span class="muted" title="${esc(new Date(c.created_at).toLocaleString('en-IN', { timeZone: TZ }))}">${timeAgo(c.created_at)}</span>${c.author_id === S.me.id || isAdmin() ? `<button class="btn link cm-del" data-del="${c.id}">Delete</button>` : ''}</div>
        <div class="cm-text">${esc(c.body)}</div></div></div>`).join('') : `<div class="muted" style="font-size:13px">No comments yet. ${ref.taskId ? 'Ask a question or share an update on this task.' : 'Post updates for everyone on this project.'}</div>`;
    $$('[data-del]', list).forEach(b => b.onclick = async () => {
      if (!confirm('Delete this comment?')) return;
      try { await q(sb.from('comments').delete().eq('id', b.dataset.del)); load(); } catch (e) { toast(e.message, 'bad'); }
    });
    list.scrollTop = list.scrollHeight;
    box.dispatchEvent(new CustomEvent('comments', { detail: rows.length }));
  };
  const send = async () => {
    const body = ta.value.trim(); if (!body) return;
    btn.disabled = true;
    try {
      await q(sb.from('comments').insert({ task_id: ref.taskId || null, project_id: ref.projectId || null, author_id: S.me.id, body }));
      ta.value = ''; await load();
    } catch (e) { toast(e.message, 'bad'); }
    btn.disabled = false; ta.focus();
  };
  btn.onclick = send;
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); } });
  await load();
}

/* ---------- Projects (project managers) ---------- */
const PSTATUS = { active: ['ok', 'Active'], on_hold: ['warn', 'On hold'], completed: ['muted', 'Completed'] };
const PCOLORS = ['#3A9A52', '#2D6CDF', '#7C4DDB', '#D9480F', '#C2255C', '#0B7285', '#B7791F', '#131C3F'];

function projectStats(pr, tasks, logs, today) {
  const ts = tasks.filter(t => t.project_id === pr.id);
  const by = st => ts.filter(t => t.status === st).length;
  const done = by('done'), pct = ts.length ? Math.round(done / ts.length * 100) : 0;
  const ids = new Set(ts.map(t => t.id));
  const mins = logs.filter(l => ids.has(l.task_id)).reduce((s, l) => s + logMinutes(l), 0);
  const overdue = ts.filter(t => t.status !== 'done' && t.due_date && t.due_date < today).length;
  const people = [...new Set(ts.map(t => t.assigned_to))].map(profileOf).filter(p => p.id);
  return { ts, done, pct, mins, overdue, people, todo: by('todo'), prog: by('in_progress'), review: by('review') };
}
const stackBar = st => { const total = st.ts.length || 1;
  return `<div class="stack">${['done', 'review', 'in_progress', 'todo'].map(k => { const n = k === 'done' ? st.done : k === 'review' ? st.review : k === 'in_progress' ? st.prog : st.todo; return n ? `<span style="width:${n / total * 100}%;background:${TCOLOR[k]}" title="${TSTATUS[k]}: ${n}"></span>` : ''; }).join('')}</div>`; };

function openProject(pr) {
  const isNew = !pr, p = pr || { status: 'active', color: PCOLORS[S.projects.length % PCOLORS.length], owner_id: S.me.id };
  const pms = S.profiles.filter(x => x.is_active && (x.role === 'manager' || x.role === 'admin'));
  openModal({
    title: isNew ? 'New project' : 'Edit project',
    body: `<div class="form-grid">
      <div class="field full"><label for="pr-name">Project name</label><input id="pr-name" type="text" value="${esc(p.name || '')}" placeholder="e.g. Navdrushti website redesign"></div>
      <div class="field"><label for="pr-client">Client</label><input id="pr-client" type="text" value="${esc(p.client || '')}" placeholder="e.g. Navdrushti Foundation"></div>
      <div class="field"><label for="pr-owner">Project manager</label><select id="pr-owner"><option value="">None</option>${pms.map(m => `<option value="${m.id}" ${m.id === p.owner_id ? 'selected' : ''}>${esc(m.full_name || m.email)}</option>`).join('')}</select></div>
      <div class="field"><label for="pr-start">Start date</label><input id="pr-start" type="date" value="${esc(p.start_date || '')}"></div>
      <div class="field"><label for="pr-due">Due date</label><input id="pr-due" type="date" value="${esc(p.due_date || '')}"></div>
      <div class="field"><label for="pr-status">Status</label><select id="pr-status">${Object.entries(PSTATUS).map(([v, [, l]]) => `<option value="${v}" ${p.status === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      <div class="field"><label>Colour</label><div class="swatches">${PCOLORS.map(c => `<label class="sw" style="background:${c}"><input type="radio" name="pr-color" value="${c}" ${c === p.color ? 'checked' : ''} aria-label="${c}"></label>`).join('')}</div></div>
      <div class="field full"><label for="pr-desc">Description</label><textarea id="pr-desc" placeholder="Scope, links, notes">${esc(p.description || '')}</textarea></div>
    </div>`,
    footer: `${!isNew ? '<button class="btn danger" id="pr-del" style="margin-right:auto">Delete project</button>' : ''}<button class="btn" data-close>Cancel</button><button class="btn primary" id="pr-save">${isNew ? 'Create project' : 'Save project'}</button>`,
    onMount: (root, close) => {
      $('[data-close]', root).onclick = close;
      $('#pr-save', root).onclick = async () => {
        const v = s => $(s, root).value.trim() || null;
        const row = { name: v('#pr-name'), client: v('#pr-client'), owner_id: v('#pr-owner'), start_date: v('#pr-start'), due_date: v('#pr-due'), status: v('#pr-status'), color: $('input[name=pr-color]:checked', root)?.value || PCOLORS[0], description: v('#pr-desc') };
        if (!row.name) return toast('Enter a project name', 'bad');
        try {
          if (isNew) { const created = await q(sb.from('projects').insert({ ...row, created_by: S.me.id }).select().single()); S.projects = await q(sb.from('projects').select('*').order('name')).catch(() => S.projects); close(); toast('Project created'); location.hash = `#/project/${created.id}`; }
          else { await q(sb.from('projects').update(row).eq('id', p.id)); await q(sb.from('tasks').update({ project: row.name }).eq('project_id', p.id)).catch(() => {}); S.projects = await q(sb.from('projects').select('*').order('name')).catch(() => S.projects); close(); toast('Project saved'); route(); }
        } catch (e) { toast(e.message, 'bad'); }
      };
      $('#pr-del', root) && ($('#pr-del', root).onclick = async () => {
        if (!confirm('Delete this project and its discussion? Tasks and time logs are kept but will no longer belong to a project.')) return;
        try { await q(sb.from('projects').delete().eq('id', p.id)); close(); toast('Project deleted'); location.hash = '#/projects'; }
        catch (e) { toast(e.message, 'bad'); }
      });
    }
  });
}

VIEWS.project = async (el, id) => {
  const pr = await q(sb.from('projects').select('*').eq('id', id).maybeSingle());
  if (!pr) { el.innerHTML = '<div class="card empty">Project not found. <a href="#/projects">Back to projects</a></div>'; return; }
  $('#page-title').textContent = pr.name;
  const today = istDate(), soon = addDays(today, 7);
  const tasks = await q(sb.from('tasks').select('*').eq('project_id', id).order('created_at'));
  const [logs, cmts] = await Promise.all([
    tasks.length ? inChunks(tasks.map(t => t.id), ch => sb.from('time_logs').select('task_id,employee_id,started_at,ended_at,minutes').in('task_id', ch)).catch(() => []) : [],
    q(sb.from('comments').select('task_id').eq('project_id', id).not('task_id', 'is', null)).catch(() => [])
  ]);
  const spent = tid => logs.filter(l => l.task_id === tid).reduce((s, l) => s + logMinutes(l), 0);
  const ccount = tid => cmts.filter(c => c.task_id === tid).length;
  const st = projectStats(pr, tasks, logs, today);
  const who = S.projWho, view = S.projView || 'overview';
  const shown = tasks.filter(t => !who || t.assigned_to === who);
  const [pc, pl] = PSTATUS[pr.status] || PSTATUS.active;
  const due = t => t.due_date ? `<span class="${t.status !== 'done' && t.due_date < today ? 'overdue' : ''}">${fmtShort(t.due_date)}</span>` : '';
  const ck = t => { const c = Array.isArray(t.checklist) ? t.checklist : []; return c.length ? `<span title="Checklist">${icon('check')}${c.filter(x => x.done).length}/${c.length}</span>` : ''; };
  const cc = t => ccount(t.id) ? `<span title="Comments">${icon('chat')}${ccount(t.id)}</span>` : '';
  const tcard = t => { const [qc, ql] = PRIORITY[t.priority] || PRIORITY.medium, a = profileOf(t.assigned_to), m = spent(t.id);
    return `<div class="tcard" draggable="true" data-id="${t.id}"><div class="task-title">${esc(t.title)}</div>
      <div class="tcard-meta"><span class="pill ${qc}">${ql}</span>${due(t)}<span class="sp"></span>${ck(t)}${cc(t)}${m ? `<span>${hm(m)}</span>` : ''}<span class="avatar sm" title="${esc(a.full_name || '')}">${esc(initials(a.full_name || a.email))}</span></div></div>`; };
  const daysLeft = pr.due_date ? Math.round((dObj(pr.due_date) - dObj(today)) / 864e5) : null;

  const overview = () => {
    const work = st.people.map(p => { const mine = tasks.filter(t => t.assigned_to === p.id);
      return { p, open: mine.filter(t => t.status !== 'done').length, review: mine.filter(t => t.status === 'review').length, done: mine.filter(t => t.status === 'done').length, late: mine.filter(t => t.status !== 'done' && t.due_date && t.due_date < today).length, mins: mine.reduce((s, t) => s + spent(t.id), 0) }; });
    const attention = tasks.filter(t => t.status !== 'done' && t.due_date && t.due_date <= soon).sort((a, b) => a.due_date.localeCompare(b.due_date));
    return `<div class="grid g-2">
      <div class="card"><div class="card-h"><h2>Progress</h2></div><div class="card-b">
        <div style="display:flex;align-items:baseline;gap:10px"><b style="font-size:44px;line-height:1">${st.pct}%</b><span class="muted">${st.done} of ${st.ts.length} tasks done</span></div>
        ${stackBar(st)}
        <div class="legend" style="border:0;padding:6px 0 0">${['todo', 'in_progress', 'review', 'done'].map(k => `<span><span class="dot" style="background:${TCOLOR[k]}"></span>${TSTATUS[k]} <b>${k === 'done' ? st.done : k === 'review' ? st.review : k === 'in_progress' ? st.prog : st.todo}</b></span>`).join('')}</div>
        <div class="stats" style="margin:16px 0 0;grid-template-columns:repeat(3,1fr)">
          <div class="stat"><span>${daysLeft == null ? 'Due date' : daysLeft >= 0 ? 'Days left' : 'Days overdue'}</span><b class="${daysLeft != null && daysLeft < 0 && pr.status !== 'completed' ? 'overdue' : ''}">${daysLeft == null ? '—' : Math.abs(daysLeft)}</b></div>
          <div class="stat"><span>Overdue tasks</span><b class="${st.overdue ? 'overdue' : ''}">${st.overdue}</b></div>
          <div class="stat"><span>Time logged</span><b>${hm(st.mins)}</b></div></div>
      </div></div>
      <div class="card"><div class="card-h"><h2>Team workload</h2></div>
        <div class="table-wrap"><table><thead><tr><th>Person</th><th>Open</th><th>Review</th><th>Done</th><th>Overdue</th><th>Time</th></tr></thead><tbody>
        ${work.map(w => `<tr><td>${personLink(w.p)}</td><td class="num">${w.open}</td><td class="num">${w.review}</td><td class="num">${w.done}</td><td class="num">${w.late ? `<span class="pill bad">${w.late}</span>` : '0'}</td><td class="num">${hm(w.mins)}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">Assign tasks to see who is working on what.</td></tr>'}
        </tbody></table></div></div>
    </div>
    <div class="grid g-2" style="margin-top:20px">
      <div class="card" style="align-self:start"><div class="card-h"><h2>Needs attention</h2><span class="sub">Overdue or due in 7 days</span></div><div class="card-b">
        ${attention.map(t => `<div class="list-row" data-open="${t.id}" style="cursor:pointer"><span class="dot" style="background:${TCOLOR[t.status]}"></span><div style="flex:1;min-width:0"><div class="task-title">${esc(t.title)}</div><div class="task-sub">${esc(nameOf(t.assigned_to))} · ${TSTATUS[t.status]}</div></div>${due(t)}</div>`).join('') || '<div class="empty">Nothing overdue or due this week.</div>'}
      </div></div>
      <div class="card"><div class="card-h"><h2>Discussion</h2><span class="sub">Updates for the whole project</span></div><div class="card-b" id="pj-comments"></div></div>
    </div>`;
  };

  el.innerHTML = `<a class="back" href="#/projects">${icon('back')}All projects</a>
    <div class="card proj-head" style="--pc:${esc(pr.color || '#3A9A52')}">
      <div style="min-width:0;flex:1">
        <h2>${esc(pr.name)}</h2>
        <div class="muted">${esc(pr.client || 'Internal')}${pr.owner_id ? ` · PM ${esc(nameOf(pr.owner_id))}` : ''}${pr.start_date || pr.due_date ? ` · ${pr.start_date ? fmtShort(pr.start_date) : '…'} → ${pr.due_date ? fmtDate(pr.due_date) : '…'}` : ''}</div>
        ${pr.description ? `<p style="margin:10px 0 0;color:var(--ink-2);white-space:pre-line">${esc(pr.description)}</p>` : ''}
      </div>
      <div class="right"><span class="pill ${pc}">${pl}</span><button class="btn" id="pv-edit">Edit project</button><button class="btn primary" id="pv-add">${icon('plus')}Add task</button></div>
    </div>
    <div class="tabs" role="tablist">${[['overview', 'Overview'], ['board', 'Board'], ['list', 'List']].map(([v, l]) => `<button data-pv="${v}" class="${view === v ? 'on' : ''}">${l}</button>`).join('')}</div>
    ${view !== 'overview' ? `<div class="toolbar"><div class="field" style="min-width:200px"><label for="pv-who">Assignee</label><select id="pv-who"><option value="">Everyone</option>${st.people.map(p => `<option value="${p.id}" ${who === p.id ? 'selected' : ''}>${esc(p.full_name || p.email)}</option>`).join('')}</select></div></div>` : ''}
    ${view === 'overview' ? overview()
    : view === 'board' ? `<div class="board">${Object.entries(TSTATUS).map(([s, label]) => { const ts = shown.filter(t => t.status === s);
        return `<div class="col" data-col="${s}"><div class="col-h"><span class="dot" style="background:${TCOLOR[s]}"></span>${label} <span class="n">${ts.length}</span><button class="btn sm" data-add="${s}" aria-label="Add task to ${label}">${icon('plus')}</button></div>${ts.map(tcard).join('')}</div>`; }).join('')}</div>
      <p class="muted" style="font-size:13px">Drag cards between columns to change status, or click a card to open it.</p>`
    : `<div class="card"><div class="table-wrap"><table><thead><tr><th>Task</th><th>Assigned to</th><th>Due</th><th>Priority</th><th>Status</th><th>Checklist</th><th>Time</th></tr></thead><tbody>
      ${Object.keys(TSTATUS).flatMap(s => shown.filter(t => t.status === s)).map(t => { const [qc, ql] = PRIORITY[t.priority] || PRIORITY.medium, c = Array.isArray(t.checklist) ? t.checklist : [];
        return `<tr data-open="${t.id}" style="cursor:pointer"><td style="white-space:normal"><span class="task-title">${esc(t.title)}</span>${ccount(t.id) ? ` <span class="task-sub">${icon('chat')}${ccount(t.id)}</span>` : ''}</td><td>${esc(nameOf(t.assigned_to))}</td><td class="num">${due(t) || '—'}</td><td><span class="pill ${qc}">${ql}</span></td><td><span class="pill" style="background:${TCOLOR[t.status]}1f;color:${TCOLOR[t.status]}">${TSTATUS[t.status]}</span></td><td class="num">${c.length ? `${c.filter(x => x.done).length}/${c.length}` : '—'}</td><td class="num">${hm(spent(t.id))}</td></tr>`; }).join('') || '<tr><td colspan="7" class="empty">No tasks yet. Click Add task.</td></tr>'}
      </tbody></table></div></div>`}`;

  $('#pv-edit').onclick = () => openProject(pr);
  $('#pv-add').onclick = () => openTask(null, { projectId: id });
  $$('[data-add]', el).forEach(b => b.onclick = () => openTask(null, { projectId: id, status: b.dataset.add }));
  $$('[data-pv]', el).forEach(b => b.onclick = () => { S.projView = b.dataset.pv; route(); });
  $('#pv-who') && ($('#pv-who').onchange = e => { S.projWho = e.target.value; route(); });
  $$('[data-open]', el).forEach(r => r.onclick = () => openTask(tasks.find(t => t.id === r.dataset.open)));
  if ($('#pj-comments')) mountComments($('#pj-comments'), { projectId: id });
  let dragged = null;
  $$('.tcard', el).forEach(c => {
    c.onclick = () => openTask(tasks.find(t => t.id === c.dataset.id));
    c.addEventListener('dragstart', e => { dragged = c.dataset.id; c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
    c.addEventListener('dragend', () => c.classList.remove('dragging'));
  });
  $$('[data-col]', el).forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drop'); });
    col.addEventListener('dragleave', () => col.classList.remove('drop'));
    col.addEventListener('drop', async e => {
      e.preventDefault(); col.classList.remove('drop');
      const t = tasks.find(x => x.id === dragged); if (!t || t.status === col.dataset.col) return;
      try { await q(sb.from('tasks').update({ status: col.dataset.col }).eq('id', t.id)); toast(`Moved to ${TSTATUS[col.dataset.col]}`); await refreshRunning(); route(); }
      catch (err) { toast(err.message, 'bad'); }
    });
  });
};

  const list = S.profiles;
  const details = await q(sb.from('employee_details').select('employee_id,phone')).catch(() => []);
  const phoneOf = id => details.find(d => d.employee_id === id)?.phone;
  el.innerHTML = `<div class="note" style="margin-bottom:20px">To add someone, go to Supabase → Authentication → Users → <b>Invite user</b>. They appear here once invited; then set their department, role and manager.</div>
    <div class="toolbar"><div class="field grow"><label for="e-search">Search</label><input id="e-search" type="text" placeholder="Name, email, department"></div></div>
    <div class="card"><div class="table-wrap"><table><thead><tr><th>Employee</th><th>ID</th><th>Phone</th><th>Joined</th><th>Role</th><th>Reports to</th><th>Status</th><th></th></tr></thead>
    <tbody id="e-rows">${list.map(p => `<tr data-s="${esc((p.full_name + ' ' + p.email + ' ' + (p.department || '')).toLowerCase())}">
      <td>${personLink(p, p.email)}</td>
      <td class="muted">${esc(p.employee_code || '—')}</td><td class="num">${phoneOf(p.id) ? `<a href="tel:${esc(phoneOf(p.id))}" style="color:inherit">${esc(phoneOf(p.id))}</a>` : '<span class="muted">—</span>'}</td><td>${p.date_of_joining ? fmtDate(p.date_of_joining) : '<span class="muted">—</span>'}</td>
      <td style="text-transform:capitalize">${esc(p.role)}</td><td>${p.manager_id ? esc(nameOf(p.manager_id)) : '<span class="muted">—</span>'}</td>
      <td>${p.is_active ? '<span class="pill ok">Active</span>' : '<span class="pill muted">Inactive</span>'}</td>
      <td style="text-align:right"><button class="btn sm" data-edit="${p.id}">Edit</button></td></tr>`).join('')}</tbody></table></div></div>`;
  $('#e-search').oninput = e => { const v = e.target.value.toLowerCase(); $$('#e-rows tr').forEach(r => r.style.display = r.dataset.s.includes(v) ? '' : 'none'); };
  $$('[data-edit]', el).forEach(b => b.onclick = () => editEmployee(b.dataset.edit));
};

async function editEmployee(id) {
  const p = profileOf(id), year = +istDate().slice(0, 4);
  const bals = await q(sb.from('leave_balances').select('*').eq('employee_id', id).eq('year', year));
  const paidTypes = S.leaveTypes.filter(t => t.is_paid && t.is_active);
  const managers = S.profiles.filter(x => x.id !== id && x.is_active && (x.role === 'manager' || x.role === 'admin'));
  openModal({
    title: `Edit ${p.full_name || p.email}`,
    body: `<div class="form-grid">
      <div class="field"><label for="f-name">Full name</label><input id="f-name" type="text" value="${esc(p.full_name)}"></div>
      <div class="field"><label for="f-code">Employee ID</label><input id="f-code" type="text" value="${esc(p.employee_code || '')}"></div>
      <div class="field"><label for="f-dept">Department</label><input id="f-dept" type="text" value="${esc(p.department || '')}"></div>
      <div class="field"><label for="f-desig">Designation</label><input id="f-desig" type="text" value="${esc(p.designation || '')}"></div>
      <div class="field"><label for="f-role">Role</label><select id="f-role">${['employee', 'manager', 'admin'].map(r => `<option value="${r}" ${p.role === r ? 'selected' : ''}>${r[0].toUpperCase() + r.slice(1)}</option>`).join('')}</select></div>
      <div class="field"><label for="f-mgr">Reports to</label><select id="f-mgr"><option value="">No manager</option>${managers.map(m => `<option value="${m.id}" ${p.manager_id === m.id ? 'selected' : ''}>${esc(m.full_name || m.email)}</option>`).join('')}</select></div>
      <div class="field"><label for="f-doj">Date of joining</label><input id="f-doj" type="date" value="${esc(p.date_of_joining || '')}"></div>
      <div class="field"><label for="f-active">Status</label><select id="f-active"><option value="1" ${p.is_active ? 'selected' : ''}>Active</option><option value="0" ${!p.is_active ? 'selected' : ''}>Inactive (can't sign in)</option></select></div>
      <div class="full note">Phone, date of birth, emergency contact and address are added by the employee in <b>My profile</b>.</div>
      <div class="full" style="margin-top:6px"><b>Leave allotted for ${year}</b><div class="hint muted" style="font-size:12.5px">Days used so far are kept as they are.</div></div>
      ${paidTypes.map(t => { const b = bals.find(x => x.leave_type_id === t.id); return `<div class="field"><label for="f-bal-${t.id}">${esc(t.name)}${b ? ` <span class="muted">(${num(b.used)} used)</span>` : ''}</label><input id="f-bal-${t.id}" data-bal="${t.id}" type="number" min="0" step="0.5" value="${b ? num(b.allotted) : ''}" placeholder="${num(t.annual_quota)}"></div>`; }).join('')}
    </div>`,
    footer: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="f-save">Save changes</button>`,
    onMount: (root, close) => {
      $('[data-close]', root).onclick = close;
      $('#f-save', root).onclick = async () => {
        const v = s => $(s, root).value.trim();
        try {
          await q(sb.from('profiles').update({
            full_name: v('#f-name'), employee_code: v('#f-code') || null, department: v('#f-dept') || null,
            designation: v('#f-desig') || null, role: v('#f-role'), manager_id: v('#f-mgr') || null,
            date_of_joining: v('#f-doj') || null, is_active: v('#f-active') === '1'
          }).eq('id', id));
          const ups = $$('[data-bal]', root).filter(i => i.value !== '').map(i => ({ employee_id: id, leave_type_id: +i.dataset.bal, year, allotted: +i.value }));
          if (ups.length) await q(sb.from('leave_balances').upsert(ups, { onConflict: 'employee_id,leave_type_id,year' }));
          close(); toast('Employee saved');
          if (id === S.me.id) { await loadDirectory(); S.me = profileOf(id); S.shell = false; }
          route();
        } catch (e) { toast(e.message, 'bad'); }
      };
    }
  });
}

/* ---------- Leave types, holidays, shift settings (admin) ---------- */
