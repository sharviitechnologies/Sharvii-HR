<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sharvii People</title>
<link rel="icon" href="https://sharviitechnologies.com/wp-content/uploads/2026/01/cropped-ST-logo-270x270.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#1E4FA3;
  --brand-ink:#ffffff;
  --brand-soft:color-mix(in srgb, var(--brand) 9%, #ffffff);
  --brand-line:color-mix(in srgb, var(--brand) 22%, #ffffff);
  --ink:#1B2430; --ink-2:#4A5565; --ink-3:#7A8494;
  --line:#E3E7EC; --canvas:#F4F6F8; --surface:#ffffff;
  --ok:#1E8A5A; --ok-soft:#E4F4EB;
  --warn:#A3650E; --warn-soft:#FCF1DE;
  --bad:#B53A2B; --bad-soft:#FBE8E5;
  --muted-soft:#EEF0F3;
  --side:240px;
  font-family:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  color:var(--ink); font-size:15px; line-height:1.5;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--canvas)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.ic{width:20px;height:20px;flex:none}
.num{font-variant-numeric:tabular-nums}

/* ---------- Layout ---------- */
.layout{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:20px 20px 18px;border-bottom:1px solid var(--line)}
.brand img{height:34px;max-width:150px;object-fit:contain}
.brand-fallback{display:none;width:34px;height:34px;border-radius:8px;background:var(--brand);color:var(--brand-ink);font-weight:700;align-items:center;justify-content:center}
.brand-name{font-weight:700;font-size:14px;line-height:1.2}
.brand-name small{display:block;font-weight:500;color:var(--ink-3);font-size:12px}
.nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--canvas);color:var(--ink)}
.nav a.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav .badge{margin-left:auto}
.side-foot{padding:14px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3)}
.main{min-width:0;display:flex;flex-direction:column}
.top{height:64px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 28px;position:sticky;top:0;z-index:5}
.top h1{font-size:19px;margin:0;font-weight:700}
.top .today{color:var(--ink-3);font-size:13px}
.user{margin-left:auto;display:flex;align-items:center;gap:10px;background:none;border:1px solid transparent;border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer}
.user:hover{border-color:var(--line)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.user-text{text-align:left;line-height:1.2}
.user-text b{display:block;font-size:14px}
.user-text span{font-size:12px;color:var(--ink-3);text-transform:capitalize}
.content{padding:28px;max-width:1240px;width:100%}
.bottom-nav{display:none}

/* ---------- Building blocks ---------- */
.grid{display:grid;gap:20px}
.g-2{grid-template-columns:1.4fr 1fr}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.card-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:15px;margin:0;font-weight:700}
.card-h .sub{color:var(--ink-3);font-size:13px}
.card-h .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.card-b{padding:18px 20px}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:20px}
.toolbar .grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,#fff)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.link{border:none;background:none;color:var(--brand);padding:0}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--ink-3)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=month],input[type=number],select,textarea{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
textarea{resize:vertical;min-height:80px}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--brand-soft);color:var(--brand)}
.pill.muted{background:var(--muted-soft);color:var(--ink-3)}
.badge{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px;min-width:20px;text-align:center}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12.5px;font-weight:600;color:var(--ink-3);padding:10px 16px;border-bottom:1px solid var(--line);background:#FAFBFC;white-space:nowrap}
td{padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.muted,.muted{color:var(--ink-3)}
td.num,td:first-child{white-space:nowrap}
.who{display:flex;align-items:center;gap:10px}
.who b{font-weight:600;display:block}
.who small{color:var(--ink-3);font-size:12.5px}
.empty{padding:36px 20px;text-align:center;color:var(--ink-3)}
.loading{padding:40px;text-align:center;color:var(--ink-3)}
.note{background:var(--brand-soft);border:1px solid var(--brand-line);border-radius:10px;padding:12px 14px;font-size:13.5px;color:var(--ink-2)}

/* ---------- Check-in panel (the signature element) ---------- */
.punch{background:var(--brand);color:var(--brand-ink);border-radius:14px;padding:26px 28px;display:grid;grid-template-columns:1fr minmax(260px,340px);gap:28px;align-items:center;margin-bottom:20px}
.punch-date{font-size:14px;opacity:.85}
.punch-clock{font-size:clamp(38px,6vw,58px);font-weight:700;letter-spacing:-.02em;line-height:1.05;margin:4px 0 8px;font-variant-numeric:tabular-nums}
.punch-status{font-size:15px;opacity:.95}
.punch-btn{width:100%;padding:14px;font-size:16px;border-radius:10px;background:#fff;color:var(--brand);border:none}
.punch-btn:hover{filter:none;background:#F1F4F9}
.punch[data-state=in] .punch-btn{background:#fff;color:var(--bad)}
.punch[data-state=done] .punch-btn{background:rgba(255,255,255,.18);color:#fff;cursor:default}
.shift{margin-top:16px}
.shift-bar{height:8px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
.shift-bar span{display:block;height:100%;background:#fff;border-radius:99px;transition:width .6s ease}
.shift-meta{display:flex;justify-content:space-between;font-size:12.5px;margin-top:8px;opacity:.9;font-variant-numeric:tabular-nums}
.shift-meta b{font-weight:700}

/* ---------- Stats & balances ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat span{font-size:13px;color:var(--ink-3)}
.stat b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.bal-list{display:flex;flex-direction:column}
.bal{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.bal:last-child{border-bottom:none}
.bal-name{font-weight:600}
.bal-left{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.bal-left small{font-weight:500;color:var(--ink-3)}
.bal-track{grid-column:1/-1;height:6px;border-radius:99px;background:var(--muted-soft);overflow:hidden;display:flex}
.bal-track .u{background:var(--brand)}
.bal-track .p{background:color-mix(in srgb,var(--brand) 40%,#fff)}
.bal-meta{grid-column:1/-1;font-size:12.5px;color:var(--ink-3)}
.list-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:none}
.date-chip{width:46px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:3px 0;line-height:1.15;flex:none}
.date-chip b{display:block;font-size:17px}
.date-chip small{font-size:11px;color:var(--ink-3)}

/* ---------- Approvals ---------- */
.req{padding:18px 20px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:14px}
.req:last-child{border-bottom:none}
.req-meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--ink-2);margin-top:6px}
.req-reason{margin-top:8px;font-size:14px;color:var(--ink-2)}
.req-act{display:flex;flex-direction:column;gap:8px;min-width:230px}
.req-act .row{display:flex;gap:8px}
.req-act .row .btn{flex:1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs button{border:none;background:none;padding:10px 14px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}

/* ---------- Modal & toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,28,40,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.dialog{background:#fff;border-radius:14px;width:min(560px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(20,28,40,.25)}
.dialog-h{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.dialog-h h3{margin:0;font-size:17px}
.dialog-h .x{margin-left:auto;border:none;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--ink-3)}
.dialog-b{padding:20px 22px;overflow-y:auto}
.dialog-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.t{background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.t.bad{background:var(--bad)}

/* ---------- Login ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth-brand{background:var(--brand);color:var(--brand-ink);padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.auth-logo{background:#fff;border-radius:12px;padding:10px 14px;display:inline-flex;align-self:flex-start}
.auth-logo img{height:40px}
.auth-brand h2{font-size:clamp(28px,3.4vw,42px);line-height:1.15;margin:0 0 14px;font-weight:700;letter-spacing:-.01em;max-width:14ch}
.auth-brand p{opacity:.88;max-width:40ch;margin:0}
.auth-brand .foot{font-size:13px;opacity:.75}
.auth-form{display:flex;align-items:center;justify-content:center;padding:40px 24px;background:#fff}
.auth-form form{width:min(380px,100%);display:flex;flex-direction:column;gap:16px}
.auth-form h1{font-size:24px;margin:0}
.auth-form .lead{color:var(--ink-3);margin:-8px 0 6px}
.err{color:var(--bad);font-size:13.5px;min-height:20px}

/* ---------- Responsive ---------- */
@media (max-width:1000px){.g-2{grid-template-columns:1fr}}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .side{display:none}
  .top{padding:0 16px;height:58px}
  .top .today,.user-text{display:none}
  .user{padding:4px}
  .content{padding:16px 16px calc(84px + env(safe-area-inset-bottom))}
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20;overflow-x:auto}
  .bottom-nav a{flex:1 0 64px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink-3);text-decoration:none;padding:6px 2px;border-radius:8px;position:relative}
  .bottom-nav a.on{color:var(--brand);font-weight:600}
  .bottom-nav .badge{position:absolute;top:0;right:calc(50% - 22px);font-size:10px;padding:0 5px;min-width:16px}
  .punch{grid-template-columns:1fr;padding:22px;gap:18px}
  .req{grid-template-columns:1fr}
  .req-act{min-width:0}
  .form-grid{grid-template-columns:1fr}
  .auth{grid-template-columns:1fr}
  .auth-brand{padding:28px 24px;gap:28px}
  .auth-brand h2{font-size:26px}
  .auth-brand .foot{display:none}
  th,td{padding:10px 12px}
}
</style>
</head>
<body>
<div id="app"><div class="loading">Loading…</div></div>
<div id="modal-root"></div>
<div id="toast" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ======================================================================
   SETTINGS — edit these values
   Supabase → Project Settings → API: copy "Project URL" and "anon public" key.
   The anon key is safe to publish; the database rules (RLS) protect the data.
   ====================================================================== */
const CONFIG = {
  SUPABASE_URL: 'https://zzbiaqmtoxtcnnfcsbbo.supabase.co',
  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp6YmlhcW10b3h0Y25uZmNzYmJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNzU4NDMsImV4cCI6MjEwNjk1MTg0M30.pYBwT8WC7uW2XRklTeTHfQr-qy-lOw0LcxoLge3bTMQ',
  APP_NAME: 'Sharvii People',
  COMPANY: 'Sharvii Technologies',
  LOGO_URL: 'https://sharviitechnologies.com/wp-content/uploads/2026/04/sharvi-logo.png',
  BRAND_COLOR: '#1E4FA3',      // change to your logo colour
  SHIFT_HOURS: 9,              // used for the progress bar on Home
  TIMEZONE: 'Asia/Kolkata',
  WEEKEND_DAYS: [0, 6]         // 0 = Sunday, 6 = Saturday (keep in sync with SQL)
};
/* ====================================================================== */

document.documentElement.style.setProperty('--brand', CONFIG.BRAND_COLOR);
document.title = CONFIG.APP_NAME;

const configured = !CONFIG.SUPABASE_URL.includes('YOUR-PROJECT');
const sb = configured ? supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY) : null;
const S = { me: null, profiles: [], leaveTypes: [], clockTimer: null, attMonth: null, attWho: null, apprTab: 'pending' };
const TZ = CONFIG.TIMEZONE;

/* ---------- Helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const istDate = (d = new Date()) => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
const fmtTime = ts => ts ? new Date(ts).toLocaleTimeString('en-IN', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: true }) : '—';
const dObj = d => new Date(d + 'T00:00:00');
const fmtDate = d => d ? dObj(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
const fmtShort = d => d ? dObj(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) : '—';
const dayName = d => dObj(d).toLocaleDateString('en-IN', { weekday: 'short' });
const fmtRange = (a, b) => a === b ? fmtDate(a) : `${fmtShort(a)} – ${fmtDate(b)}`;
const dur = ms => { if (!ms || ms < 0) return '0h 00m'; const m = Math.floor(ms / 60000); return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m`; };
const num = n => (Math.round(Number(n || 0) * 10) / 10).toString();
const initials = n => (n || '?').trim().split(/\s+/).slice(0, 2).map(x => x[0]).join('').toUpperCase();
const isAdmin = () => S.me?.role === 'admin';
const isMgr = () => S.me?.role === 'manager' || isAdmin();
const nameOf = id => S.profiles.find(p => p.id === id)?.full_name || S.profiles.find(p => p.id === id)?.email || 'Unknown';
const profileOf = id => S.profiles.find(p => p.id === id) || {};
const typeName = id => S.leaveTypes.find(t => t.id === id)?.name || 'Leave';
const monthBounds = ym => { const [y, m] = ym.split('-').map(Number); const last = new Date(y, m, 0).getDate(); return { first: `${ym}-01`, last: `${ym}-${String(last).padStart(2, '0')}`, days: last }; };
async function q(p) { const { data, error } = await p; if (error) throw error; return data; }

function teamList() {
  if (isAdmin()) return S.profiles.filter(p => p.is_active);
  return S.profiles.filter(p => p.is_active && (p.manager_id === S.me.id || p.id === S.me.id));
}

function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  el.className = 't ' + type; el.textContent = msg;
  $('#toast').appendChild(el);
  setTimeout(() => el.remove(), 3800);
}

function statusPill(s) {
  const map = { pending: ['warn', 'Pending'], approved: ['ok', 'Approved'], rejected: ['bad', 'Rejected'], cancelled: ['muted', 'Cancelled'] };
  const [c, t] = map[s] || ['muted', s];
  return `<span class="pill ${c}">${t}</span>`;
}

const ICONS = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  leave: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  check: '<circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/>',
  team: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16.5 14.6a5 5 0 0 1 5 5.4"/>',
  people: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  settings: '<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  report: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
  download: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  plus: '<path d="M12 5v14M5 12h14"/>'
};
const icon = n => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
const logoImg = (cls = '') => `<img class="${cls}" src="${esc(CONFIG.LOGO_URL)}" alt="${esc(CONFIG.COMPANY)}" onerror="this.style.display='none';if(this.nextElementSibling)this.nextElementSibling.style.display='flex'">`;

/* ---------- Modal ---------- */
function openModal({ title, body, footer = '', onMount }) {
  const root = $('#modal-root');
  root.innerHTML = `<div class="overlay" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="dialog"><div class="dialog-h"><h3>${esc(title)}</h3><button class="x" aria-label="Close">&times;</button></div>
    <div class="dialog-b">${body}</div>${footer ? `<div class="dialog-f">${footer}</div>` : ''}</div></div>`;
  const close = () => { root.innerHTML = ''; document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  $('.x', root).onclick = close;
  $('.overlay', root).addEventListener('mousedown', e => { if (e.target.classList.contains('overlay')) close(); });
  onMount && onMount(root, close);
  const first = $('input,select,textarea', root); first && first.focus();
  return close;
}

const VIEWS = {};

function getLocation() {
  return new Promise(res => {
    if (!navigator.geolocation) return res({});
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lng: p.coords.longitude }),
      () => res({}), { timeout: 6000, maximumAge: 60000, enableHighAccuracy: false });
  });
}

function balanceRows(bals, pending, year) {
  if (!bals.length) return `<div class="empty">No leave balance for ${year} yet. Your HR admin adds it at the start of the year.</div>`;
  return `<div class="bal-list">${bals.map(b => {
    const pend = pending.filter(r => r.leave_type_id === b.leave_type_id && r.start_date.startsWith(year)).reduce((s, r) => s + Number(r.days), 0);
    const total = Number(b.allotted) || 0, used = Number(b.used) || 0, left = total - used - pend;
    const pu = total ? Math.min(100, used / total * 100) : 0, pp = total ? Math.min(100 - pu, pend / total * 100) : 0;
    return `<div class="bal"><span class="bal-name">${esc(typeName(b.leave_type_id))}</span>
      <span class="bal-left">${num(left)} <small>of ${num(total)} days left</small></span>
      <div class="bal-track"><span class="u" style="width:${pu}%"></span><span class="p" style="width:${pp}%"></span></div>
      <span class="bal-meta">${num(used)} used${pend ? ` · ${num(pend)} awaiting approval` : ''}</span></div>`;
  }).join('')}</div>`;
}

  }[state];

  ${isMgr() ? `<div class="stats">
    <a class="stat" href="#/approvals" style="text-decoration:none;color:inherit"><span>Leave requests to review</span><b>${apprCount}</b></a>
    <a class="stat" href="#/team" style="text-decoration:none;color:inherit"><span>Team on leave today</span><b>${onLeave.length}</b></a>
    <div class="stat"><span>Your pending requests</span><b>${pending.length}</b></div>
  </div>` : ''}

  <div class="grid g-2">
    <div class="card">
      <div class="card-h"><h2>Leave balance ${year}</h2><div class="right"><button class="btn primary sm" id="apply">${icon('plus')}Apply leave</button></div></div>
      <div class="card-b">${balanceRows(bals, pending, year)}</div>

    <div class="grid" style="align-content:start">
      <div class="card">
        <div class="card-h"><h2>Upcoming holidays</h2></div>

        <div class="card-h"><h2>On leave today</h2></div>
        <div class="card-b">${onLeave.length ? onLeave.map(r => `<div class="list-row"><span class="avatar">${esc(initials(nameOf(r.employee_id)))}</span><div><b>${esc(nameOf(r.employee_id))}</b><div class="muted" style="font-size:13px">${esc(typeName(r.leave_type_id))} · back after ${fmtShort(r.end_date)}</div></div></div>`).join('') : '<div class="empty">Everyone is in today.</div>'}</div>

/* ---------- Attendance ---------- */
VIEWS.attendance = async el => {
  const month = S.attMonth || istDate().slice(0, 7);
  const team = isMgr() ? teamList() : [];
  const who = S.attWho && team.some(p => p.id === S.attWho) ? S.attWho : S.me.id;
  el.innerHTML = `<div class="toolbar">
      <div class="field"><label for="a-month">Month</label><input id="a-month" type="month" value="${month}" max="${istDate().slice(0, 7)}"></div>
      ${team.length > 1 ? `<div class="field" style="min-width:220px"><label for="a-who">Employee</label><select id="a-who">${team.map(p => `<option value="${p.id}" ${p.id === who ? 'selected' : ''}>${esc(p.full_name || p.email)}${p.id === S.me.id ? ' (you)' : ''}</option>`).join('')}</select></div>` : ''}
    </div><div id="a-body"><div class="loading">Loading…</div></div>`;
  $('#a-month').onchange = e => { S.attMonth = e.target.value; route(); };
  $('#a-who') && ($('#a-who').onchange = e => { S.attWho = e.target.value; route(); });

  const { first, last, days } = monthBounds(month);
  const [att, hols, leaves] = await Promise.all([
    q(sb.from('attendance').select('*').eq('employee_id', who).gte('work_date', first).lte('work_date', last)),
    q(sb.from('holidays').select('*').gte('holiday_date', first).lte('holiday_date', last)),
    q(sb.from('leave_requests').select('*').eq('employee_id', who).eq('status', 'approved').lte('start_date', last).gte('end_date', first))
  ]);
  const today = istDate();
  const rows = [];
  let present = 0, totalH = 0, leaveDays = 0, absent = 0;
  for (let d = days; d >= 1; d--) {
    const date = `${month}-${String(d).padStart(2, '0')}`;
    if (date > today) continue;
    const a = att.find(x => x.work_date === date);
    const h = hols.find(x => x.holiday_date === date);
    const lv = leaves.find(x => x.start_date <= date && x.end_date >= date);
    const wkend = CONFIG.WEEKEND_DAYS.includes(dObj(date).getDay());
    let st;
    if (a?.check_in) {
      present++; totalH += Number(a.hours_worked || 0);
      st = !a.check_out && date < today ? '<span class="pill warn">Missed check-out</span>' : !a.check_out ? '<span class="pill info">Working</span>' : '<span class="pill ok">Present</span>';
      if (lv) st += ` <span class="pill info">${lv.half_day ? 'Half-day leave' : 'Leave'}</span>`;
    } else if (lv) { leaveDays++; st = `<span class="pill info">${esc(typeName(lv.leave_type_id))}${lv.half_day ? ' (half day)' : ''}</span>`; }
    else if (h) st = `<span class="pill muted">${esc(h.name)}</span>`;
    else if (wkend) st = '<span class="pill muted">Weekend</span>';
    else if (date === today) st = '<span class="pill warn">Not checked in</span>';
    else { absent++; st = '<span class="pill bad">Absent</span>'; }
    rows.push(`<tr><td><b>${fmtShort(date)}</b> <span class="muted">${dayName(date)}</span></td><td>${st}</td><td class="num">${fmtTime(a?.check_in)}</td><td class="num">${fmtTime(a?.check_out)}</td><td class="num">${a?.hours_worked != null ? num(a.hours_worked) + ' h' : '—'}</td></tr>`);
  }
  $('#a-body').innerHTML = `<div class="stats">
      <div class="stat"><span>Days present</span><b>${present}</b></div>
      <div class="stat"><span>Hours worked</span><b>${num(totalH)}</b></div>
      <div class="stat"><span>Average per day</span><b>${present ? num(totalH / present) : 0} h</b></div>
      <div class="stat"><span>Leave days</span><b>${leaveDays}</b></div>
      <div class="stat"><span>Absent</span><b>${absent}</b></div>
    </div>
    <div class="card"><div class="card-h"><h2>${esc(nameOf(who))}</h2><span class="sub">${dObj(first).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' })}</span></div>
    <div class="table-wrap"><table><thead><tr><th>Date</th><th>Status</th><th>Check in</th><th>Check out</th><th>Hours</th></tr></thead>
    <tbody>${rows.join('') || '<tr><td colspan="5" class="empty">No days to show for this month yet.</td></tr>'}</tbody></table></div></div>`;
};

  const types = S.leaveTypes.filter(t => t.is_active);
  const today = istDate();
  openModal({
    title: 'Apply leave',

      <div class="field"><label for="lv-to">To</label><input id="lv-to" type="date" value="${today}" required></div>
      <label class="check full" id="half-wrap"><input type="checkbox" id="lv-half"> Half day</label>
      <div class="field full"><label for="lv-reason">Reason</label><textarea id="lv-reason" placeholder="Optional, but helps your manager decide faster"></textarea></div>
      <div class="note full">Weekends and holidays aren't counted. The number of days is worked out for you when you submit.</div>
    </form>`,
    footer: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="lv-submit">Submit request</button>`,
    onMount: (root, close) => {
      const from = $('#lv-from', root), to = $('#lv-to', root), half = $('#lv-half', root), wrap = $('#half-wrap', root);
      const sync = () => { if (to.value < from.value) to.value = from.value; to.min = from.value; const single = from.value === to.value; wrap.style.display = single ? '' : 'none'; if (!single) half.checked = false; };
      from.onchange = sync; to.onchange = sync; sync();
      $('[data-close]', root).onclick = close;
      $('#lv-submit', root).onclick = async () => {
        const b = $('#lv-submit', root); b.disabled = true;

VIEWS.team = async el => {
  const today = istDate();
  const members = teamList().filter(p => p.id !== S.me.id);
  const [att, leaves] = await Promise.all([
    q(sb.from('attendance').select('*').eq('work_date', today)),

  ]);

    const a = att.find(x => x.employee_id === p.id), lv = leaves.find(x => x.employee_id === p.id);

  });

};

/* ---------- Reports ---------- */
function downloadCSV(name, rows) {
  const csv = rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}

    e.preventDefault();
    try { await q(sb.from('holidays').insert({ holiday_date: $('#h-date').value, name: $('#h-name').value.trim() })); toast('Holiday added'); route(); }
    catch (err) { toast(err.code === '23505' ? 'A holiday already exists on that date' : err.message, 'bad'); }
  };
  $$('[data-del-h]', el).forEach(b => b.onclick = async () => {
    if (!confirm('Remove this holiday?')) return;
    try { await q(sb.from('holidays').delete().eq('id', +b.dataset.delH)); toast('Holiday removed'); route(); }
    catch (e) { toast(e.message, 'bad'); }
  });
};

/* ---------- Boot ---------- */
(async function boot() {
  if (!configured) return renderSetup();
  const isRecovery = location.hash.includes('type=recovery');
  sb.auth.onAuthStateChange(evt => {
    if (evt === 'PASSWORD_RECOVERY') setTimeout(renderResetPassword, 0);
    if (evt === 'SIGNED_OUT') { S.me = null; S.shell = false; setTimeout(renderLogin, 0); }
  });
  if (isRecovery) return;
  const { data: { session } } = await sb.auth.getSession();
  session ? startApp() : renderLogin();
})();
</script>
</body>
</html>
