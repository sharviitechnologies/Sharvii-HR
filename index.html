<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sharvii People</title>
<link rel="icon" href="https://sharviitechnologies.com/wp-content/uploads/2026/01/cropped-ST-logo-270x270.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#1E4FA3;
  --brand-ink:#ffffff;
  --brand-soft:color-mix(in srgb, var(--brand) 9%, #ffffff);
  --brand-line:color-mix(in srgb, var(--brand) 22%, #ffffff);
  --ink:#1B2430; --ink-2:#4A5565; --ink-3:#7A8494;
  --line:#E3E7EC; --canvas:#F4F6F8; --surface:#ffffff;
  --ok:#1E8A5A; --ok-soft:#E4F4EB;
  --warn:#A3650E; --warn-soft:#FCF1DE;
  --bad:#B53A2B; --bad-soft:#FBE8E5;
  --muted-soft:#EEF0F3;
  --side:240px;
  --logo-bg:#0F1E3A;
  font-family:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  color:var(--ink); font-size:15px; line-height:1.5;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--canvas)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.ic{width:20px;height:20px;flex:none}
.num{font-variant-numeric:tabular-nums}

/* ---------- Layout ---------- */
.layout{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:18px 20px;background:var(--logo-bg)}
.brand img{height:38px;max-width:170px;object-fit:contain}
.brand-fallback{display:none;width:34px;height:34px;border-radius:8px;background:var(--brand);color:var(--brand-ink);font-weight:700;align-items:center;justify-content:center}
.brand-name{font-weight:700;font-size:14px;line-height:1.2}
.brand-name small{display:block;font-weight:500;color:var(--ink-3);font-size:12px}
.nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--canvas);color:var(--ink)}
.nav a.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav .badge{margin-left:auto}
.side-foot{padding:14px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3)}
.main{min-width:0;display:flex;flex-direction:column}
.top{height:64px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 28px;position:sticky;top:0;z-index:5}
.top h1{font-size:19px;margin:0;font-weight:700}
.top .today{color:var(--ink-3);font-size:13px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px;min-width:0}
.user{display:flex;align-items:center;gap:10px;background:none;border:1px solid transparent;border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer}
.user:hover{border-color:var(--line)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.user-text{text-align:left;line-height:1.2}
.user-text b{display:block;font-size:14px}
.user-text span{font-size:12px;color:var(--ink-3);text-transform:capitalize}
.content{padding:28px;max-width:1240px;width:100%}
.bottom-nav{display:none}

/* ---------- Building blocks ---------- */
.grid{display:grid;gap:20px}
.g-2{grid-template-columns:1.4fr 1fr}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.card-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:15px;margin:0;font-weight:700}
.card-h .sub{color:var(--ink-3);font-size:13px}
.card-h .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.card-b{padding:18px 20px}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:20px}
.toolbar .grow{flex:1}
.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,#fff)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.link{border:none;background:none;color:var(--brand);padding:0}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--ink-3)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=month],input[type=number],select,textarea{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
textarea{resize:vertical;min-height:80px}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--brand-soft);color:var(--brand)}
.pill.muted{background:var(--muted-soft);color:var(--ink-3)}
.badge{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px;min-width:20px;text-align:center}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12.5px;font-weight:600;color:var(--ink-3);padding:10px 16px;border-bottom:1px solid var(--line);background:#FAFBFC;white-space:nowrap}
td{padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.muted,.muted{color:var(--ink-3)}
td.num,td:first-child{white-space:nowrap}
.who{display:flex;align-items:center;gap:10px}
.who b{font-weight:600;display:block}
.who small{color:var(--ink-3);font-size:12.5px}
.empty{padding:36px 20px;text-align:center;color:var(--ink-3)}
.loading{padding:40px;text-align:center;color:var(--ink-3)}
.note{background:var(--brand-soft);border:1px solid var(--brand-line);border-radius:10px;padding:12px 14px;font-size:13.5px;color:var(--ink-2)}

/* ---------- Check-in panel (the signature element) ---------- */
.punch{background:var(--brand);color:var(--brand-ink);border-radius:14px;padding:26px 28px;display:grid;grid-template-columns:1fr minmax(260px,340px);gap:28px;align-items:center;margin-bottom:20px}
.punch-date{font-size:14px;opacity:.85}
.punch-clock{font-size:clamp(38px,6vw,58px);font-weight:700;letter-spacing:-.02em;line-height:1.05;margin:4px 0 8px;font-variant-numeric:tabular-nums}
.punch-status{font-size:15px;opacity:.95}
.punch-btn{width:100%;padding:14px;font-size:16px;border-radius:10px;background:#fff;color:var(--brand);border:none}
.punch-btn:hover{filter:none;background:#F1F4F9}
.punch[data-state=in] .punch-btn{background:#fff;color:var(--bad)}
.punch[data-state=done] .punch-btn{background:rgba(255,255,255,.18);color:#fff;cursor:default}
.shift{margin-top:16px}
.shift-bar{height:8px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
.shift-bar span{display:block;height:100%;background:#fff;border-radius:99px;transition:width .6s ease}
.shift-meta{display:flex;justify-content:space-between;font-size:12.5px;margin-top:8px;opacity:.9;font-variant-numeric:tabular-nums}
.shift-meta b{font-weight:700}

/* ---------- Stats & balances ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat span{font-size:13px;color:var(--ink-3)}
.stat b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.bal-list{display:flex;flex-direction:column}
.bal{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.bal:last-child{border-bottom:none}
.bal-name{font-weight:600}
.bal-left{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.bal-left small{font-weight:500;color:var(--ink-3)}
.bal-track{grid-column:1/-1;height:6px;border-radius:99px;background:var(--muted-soft);overflow:hidden;display:flex}
.bal-track .u{background:var(--brand)}
.bal-track .p{background:color-mix(in srgb,var(--brand) 40%,#fff)}
.bal-meta{grid-column:1/-1;font-size:12.5px;color:var(--ink-3)}
.list-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:none}
.date-chip{width:46px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:3px 0;line-height:1.15;flex:none}
.date-chip b{display:block;font-size:17px}
.date-chip small{font-size:11px;color:var(--ink-3)}

/* ---------- Tasks & timer ---------- */
.timer-pill{display:inline-flex;align-items:center;gap:8px;background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:6px 14px;text-decoration:none;font-size:13px;font-weight:600;max-width:340px;min-width:0}
.timer-pill .tp-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-weight:500}
.rec{width:8px;height:8px;border-radius:50%;background:var(--bad);flex:none;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.run-banner{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:12px;padding:16px 20px;margin-bottom:20px}
.run-banner small{display:block;color:var(--ink-3);font-size:12.5px}
.run-banner .big{margin-left:auto;font-size:28px;font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:none;background:none;padding:8px 14px;font-weight:600;color:var(--ink-3);cursor:pointer}
.seg button.on{background:var(--brand-soft);color:var(--brand)}
.task-title{font-weight:600}
.task-sub{font-size:12.5px;color:var(--ink-3)}
.overdue{color:var(--bad);font-weight:600}
select.mini{width:auto;padding:5px 8px;font-size:13px}
.icon-btn{padding:6px 10px}
.icon-btn .ic{width:16px;height:16px}

/* ---------- Approvals ---------- */
.req{padding:18px 20px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:14px}
.req:last-child{border-bottom:none}
.req-meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--ink-2);margin-top:6px}
.req-reason{margin-top:8px;font-size:14px;color:var(--ink-2)}
.req-act{display:flex;flex-direction:column;gap:8px;min-width:230px}
.req-act .row{display:flex;gap:8px}
.req-act .row .btn{flex:1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs button{border:none;background:none;padding:10px 14px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}

/* ---------- Modal & toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,28,40,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.dialog{background:#fff;border-radius:14px;width:min(560px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(20,28,40,.25)}
.dialog-h{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.dialog-h h3{margin:0;font-size:17px}
.dialog-h .x{margin-left:auto;border:none;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--ink-3)}
.dialog-b{padding:20px 22px;overflow-y:auto}
.dialog-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.t{background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.t.bad{background:var(--bad)}

/* ---------- Login ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth-brand{background:var(--brand);color:var(--brand-ink);padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.auth-logo{background:var(--logo-bg);border-radius:12px;padding:12px 16px;display:inline-flex;align-self:flex-start}
.auth-logo img{height:40px}
.auth-brand h2{font-size:clamp(28px,3.4vw,42px);line-height:1.15;margin:0 0 14px;font-weight:700;letter-spacing:-.01em;max-width:14ch}
.auth-brand p{opacity:.88;max-width:40ch;margin:0}
.auth-brand .foot{font-size:13px;opacity:.75}
.auth-form{display:flex;align-items:center;justify-content:center;padding:40px 24px;background:#fff}
.auth-form form{width:min(380px,100%);display:flex;flex-direction:column;gap:16px}
.auth-form h1{font-size:24px;margin:0}
.auth-form .lead{color:var(--ink-3);margin:-8px 0 6px}
.err{color:var(--bad);font-size:13.5px;min-height:20px}

/* ---------- Responsive ---------- */
@media (max-width:1000px){.g-2{grid-template-columns:1fr}}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .side{display:none}
  .top{padding:0 16px;height:58px}
  .top .today,.user-text,.timer-pill .tp-title{display:none}
  .run-banner{flex-wrap:wrap}.run-banner .big{font-size:22px}
  .user{padding:4px}
  .content{padding:16px 16px calc(84px + env(safe-area-inset-bottom))}
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20;overflow-x:auto}
  .bottom-nav a{flex:1 0 64px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink-3);text-decoration:none;padding:6px 2px;border-radius:8px;position:relative}
  .bottom-nav a.on{color:var(--brand);font-weight:600}
  .bottom-nav .badge{position:absolute;top:0;right:calc(50% - 22px);font-size:10px;padding:0 5px;min-width:16px}
  .punch{grid-template-columns:1fr;padding:22px;gap:18px}
  .req{grid-template-columns:1fr}
  .req-act{min-width:0}
  .form-grid{grid-template-columns:1fr}
  .auth{grid-template-columns:1fr}
  .auth-brand{padding:28px 24px;gap:28px}
  .auth-brand h2{font-size:26px}
  .auth-brand .foot{display:none}
  th,td{padding:10px 12px}
}
</style>
</head>
<body>
<div id="app"><div class="loading">Loading…</div></div>
<div id="modal-root"></div>
<div id="toast" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ======================================================================
   SETTINGS — edit these values
   Supabase → Project Settings → API: copy "Project URL" and "anon public" key.
   The anon key is safe to publish; the database rules (RLS) protect the data.
   ====================================================================== */
const CONFIG = {
  SUPABASE_URL: 'https://sharviitechnologies.github.io/Sharvii-HR/',
  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp6YmlhcW10b3h0Y25uZmNzYmJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNzU4NDMsImV4cCI6MjEwNjk1MTg0M30.pYBwT8WC7uW2XRklTeTHfQr-qy-lOw0LcxoLge3bTMQ',
  APP_NAME: 'Sharvii People',
  COMPANY: 'Sharvii Technologies',
  LOGO_URL: 'https://sharviitechnologies.com/wp-content/uploads/2026/04/sharvi-logo.png',
  BRAND_COLOR: '#1E4FA3',      // change to your logo colour
  TIMEZONE: 'Asia/Kolkata'
  // Shift timings and days off are set by admins in the app: Leave & holidays → Shift & working days
};
/* ====================================================================== */

document.documentElement.style.setProperty('--brand', CONFIG.BRAND_COLOR);
document.title = CONFIG.APP_NAME;

const configured = !CONFIG.SUPABASE_URL.includes('YOUR-PROJECT');
const sb = configured ? supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY) : null;
const S = { me: null, profiles: [], leaveTypes: [], holidays: [], settings: null, running: null, timerTick: null, clockTimer: null, attMonth: null, attWho: null, apprTab: 'pending', taskScope: 'mine', taskFilter: 'open' };
const TZ = CONFIG.TIMEZONE;

/* ---------- Helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const istDate = (d = new Date()) => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
const fmtTime = ts => ts ? new Date(ts).toLocaleTimeString('en-IN', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: true }) : '—';
const dObj = d => new Date(d + 'T00:00:00');
const fmtDate = d => d ? dObj(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
const fmtShort = d => d ? dObj(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) : '—';
const dayName = d => dObj(d).toLocaleDateString('en-IN', { weekday: 'short' });
const fmtRange = (a, b) => a === b ? fmtDate(a) : `${fmtShort(a)} – ${fmtDate(b)}`;
const dur = ms => { if (!ms || ms < 0) return '0h 00m'; const m = Math.floor(ms / 60000); return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m`; };
const num = n => (Math.round(Number(n || 0) * 10) / 10).toString();
const initials = n => (n || '?').trim().split(/\s+/).slice(0, 2).map(x => x[0]).join('').toUpperCase();
const isAdmin = () => S.me?.role === 'admin';
const isMgr = () => S.me?.role === 'manager' || isAdmin();
const nameOf = id => S.profiles.find(p => p.id === id)?.full_name || S.profiles.find(p => p.id === id)?.email || 'Unknown';
const profileOf = id => S.profiles.find(p => p.id === id) || {};
const typeName = id => S.leaveTypes.find(t => t.id === id)?.name || 'Leave';
const monthBounds = ym => { const [y, m] = ym.split('-').map(Number); const last = new Date(y, m, 0).getDate(); return { first: `${ym}-01`, last: `${ym}-${String(last).padStart(2, '0')}`, days: last }; };
async function q(p) { const { data, error } = await p; if (error) throw error; return data; }

/* Shift & working-day helpers (settings come from the database) */
const DEFAULT_SETTINGS = { shift_start: '09:30:00', shift_end: '18:30:00', checkin_opens: '08:30:00', checkout_closes: '23:00:00', late_grace_minutes: 10, saturday_rule: 'second', tracking_start: '2026-10-07' };
S.settings = { ...DEFAULT_SETTINGS };
const pad2 = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const addDays = (date, n) => { const d = dObj(date); d.setDate(d.getDate() + n); return ymd(d); };
const toMin = t => { const [h, m] = String(t || '0:0').split(':').map(Number); return h * 60 + (m || 0); };
const istMin = (d = new Date()) => { const [h, m] = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(d).split(':'); return +h * 60 + +m; };
const istHM = ts => ts ? new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date(ts)) : '';
const fmtClock = t => { const m = typeof t === 'number' ? t : toMin(t), h = Math.floor(m / 60); return `${h % 12 || 12}:${pad2(m % 60)} ${h < 12 ? 'AM' : 'PM'}`; };
const shiftHours = () => (toMin(S.settings.shift_end) - toMin(S.settings.shift_start)) / 60;
function offReason(date) {
  const h = S.holidays.find(x => x.holiday_date === date); if (h) return h.name;
  const d = dObj(date), dow = d.getDay(), wk = Math.floor((d.getDate() - 1) / 7), r = S.settings.saturday_rule;
  if (dow === 0) return 'Sunday';
  if (dow === 6 && (r === 'all' || (r === 'second' && wk === 1) || (r === 'second_fourth' && (wk === 1 || wk === 3)))) return wk === 1 ? '2nd Saturday' : wk === 3 ? '4th Saturday' : 'Saturday off';
  return null;
}
const trackFrom = p => [S.settings.tracking_start, p?.date_of_joining || ''].sort().pop();
const lateBy = a => istMin(new Date(a.check_in)) - toMin(S.settings.shift_start);
const isLate = a => !!a?.check_in && lateBy(a) > Number(S.settings.late_grace_minutes || 0);
const isMissed = (a, date) => !!a?.check_in && !a.check_out && (date < istDate() || (date === istDate() && istMin() >= toMin(S.settings.checkout_closes)));
const hms = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(s / 3600)}:${pad2(Math.floor(s / 60) % 60)}:${pad2(s % 60)}`; };
const hm = mins => { const m = Math.round(mins || 0); return `${Math.floor(m / 60)}h ${pad2(m % 60)}m`; };
const logMinutes = l => l.ended_at ? Number(l.minutes || 0) : (Date.now() - new Date(l.started_at)) / 60000;

function teamList() {
  if (isAdmin()) return S.profiles.filter(p => p.is_active);
  return S.profiles.filter(p => p.is_active && (p.manager_id === S.me.id || p.id === S.me.id));
}

function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  el.className = 't ' + type; el.textContent = msg;
  $('#toast').appendChild(el);
  setTimeout(() => el.remove(), 3800);
}

function statusPill(s) {
  const map = { pending: ['warn', 'Pending'], approved: ['ok', 'Approved'], rejected: ['bad', 'Rejected'], cancelled: ['muted', 'Cancelled'] };
  const [c, t] = map[s] || ['muted', s];
  return `<span class="pill ${c}">${t}</span>`;
}

function openModal({ title, body, footer = '', onMount }) {

  const close = () => { root.innerHTML = ''; document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };

  $('.x', root).onclick = close;

const VIEWS = {};

function getLocation() {
  return new Promise(res => {
    if (!navigator.geolocation) return res({});
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lng: p.coords.longitude }),
      () => res({}), { timeout: 6000, maximumAge: 60000, enableHighAccuracy: false });
  });
}

function balanceRows(bals, pending, year) {
  if (!bals.length) return `<div class="empty">No leave balance for ${year} yet. Your HR admin adds it at the start of the year.</div>`;
  return `<div class="bal-list">${bals.map(b => {
    const pend = pending.filter(r => r.leave_type_id === b.leave_type_id && r.start_date.startsWith(year)).reduce((s, r) => s + Number(r.days), 0);
    const total = Number(b.allotted) || 0, used = Number(b.used) || 0, left = total - used - pend;
    const pu = total ? Math.min(100, used / total * 100) : 0, pp = total ? Math.min(100 - pu, pend / total * 100) : 0;
    return `<div class="bal"><span class="bal-name">${esc(typeName(b.leave_type_id))}</span>
      <span class="bal-left">${num(left)} <small>of ${num(total)} days left</small></span>
      <div class="bal-track"><span class="u" style="width:${pu}%"></span><span class="p" style="width:${pp}%"></span></div>
      <span class="bal-meta">${num(used)} used${pend ? ` · ${num(pend)} awaiting approval` : ''}</span></div>`;
  }).join('')}</div>`;
}

async function refreshRunning() {
  try {

    const task = log ? await q(sb.from('tasks').select('id,title,project').eq('id', log.task_id).maybeSingle()) : null;
    S.running = log ? { ...log, task } : null;
  } catch { S.running = null; }
  paintTimer();
}
function paintTimer() {
  const pill = $('#timer-pill');
  if (pill) { pill.hidden = !S.running; if (S.running) $('#timer-pill-title').textContent = S.running.task?.title || 'Task'; }
  clearInterval(S.timerTick);

  const tick = () => { const t = hms(Date.now() - new Date(S.running.started_at)); $$('[data-live-timer]').forEach(e => e.textContent = t); };
  tick(); S.timerTick = setInterval(tick, 1000);
}

  try { await q(sb.rpc('start_timer', { p_task_id: taskId })); await refreshRunning(); toast('Timer started'); route(); }

}

}

VIEWS.home = async el => {
  const st = S.settings, today = istDate(), year = today.slice(0, 4);
  const [att, bals, pending, onLeave, myTasks] = await Promise.all([
    q(sb.from('attendance').select('*').eq('employee_id', S.me.id).eq('work_date', today).maybeSingle()),
    q(sb.from('leave_balances').select('*').eq('employee_id', S.me.id).eq('year', +year)),
    q(sb.from('leave_requests').select('*').eq('employee_id', S.me.id).eq('status', 'pending')),
    isMgr() ? q(sb.from('leave_requests').select('*').eq('status', 'approved').lte('start_date', today).gte('end_date', today).neq('employee_id', S.me.id)) : Promise.resolve([]),
    q(sb.from('tasks').select('*').eq('assigned_to', S.me.id).neq('status', 'done').order('due_date', { ascending: true, nullsFirst: false }).limit(5)).catch(() => [])
  ]);
  let apprCount = 0;
  if (isMgr()) { const r = await sb.from('leave_requests').select('id', { count: 'exact', head: true }).eq('status', 'pending').neq('employee_id', S.me.id); apprCount = r.count || 0; }

  const now = istMin(), opens = toMin(st.checkin_opens), sStart = toMin(st.shift_start), sEnd = toMin(st.shift_end), closes = toMin(st.checkout_closes);
  const shiftTxt = `${fmtClock(sStart)} – ${fmtClock(sEnd)}`;
  const off = offReason(today);
  let state, label, status;
  if (!att) {
    if (now < opens) { state = 'early'; label = `Opens at ${fmtClock(opens)}`; status = `Check-in opens at ${fmtClock(opens)}. Your shift is ${shiftTxt}.`; }
    else if (now > sEnd) { state = 'closed'; label = 'Check-in closed'; status = `Check-in closed at ${fmtClock(sEnd)}. If you worked today, ask your admin to add your attendance.`; }
    else { state = 'out'; label = 'Check in'; status = now > sStart + Number(st.late_grace_minutes || 0) ? `Your shift started at ${fmtClock(sStart)}. Check in now.` : `Your shift is ${shiftTxt}.`; }
    if (off && state !== 'closed') status = `Today is a day off (${off}). You can still check in if you're working.`;
  } else if (!att.check_out) {
    if (now >= closes) { state = 'missed'; label = 'Check-out closed'; status = `You didn't check out by ${fmtClock(closes)}, so today counts as leave. Ask your admin to correct it if you worked.`; }
    else { state = 'in'; label = 'Check out'; status = `Checked in at ${fmtTime(att.check_in)}${isLate(att) ? ` (${lateBy(att)} min late)` : ''}. Check out by ${fmtClock(closes)}.`; }
  } else { state = 'done'; label = 'Done for today'; status = `You worked ${dur(new Date(att.check_out) - new Date(att.check_in))} today.`; }
  const look = state === 'in' ? 'in' : state === 'out' ? 'out' : 'done';
  const longDate = new Date().toLocaleDateString('en-IN', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  // upcoming days off: holidays + off Saturdays in the next 120 days
  const upcoming = [];
  for (let i = 0; i < 120 && upcoming.length < 5; i++) { const d = addDays(today, i), r = offReason(d); if (r && r !== 'Sunday') upcoming.push({ d, r }); }

  el.innerHTML = `
  <section class="punch" data-state="${look}">
    <div>
      <div class="punch-date">${esc(longDate)}</div>
      <div class="punch-clock" id="clock">--:--</div>
      <div class="punch-status">${esc(status)}</div>
    </div>
    <div>
      <button class="btn punch-btn" id="punch" ${['in', 'out'].includes(state) ? '' : 'disabled'}>${esc(label)}</button>
      <div class="shift">
        <div class="shift-bar"><span id="shift-fill" style="width:0%"></span></div>
        <div class="shift-meta"><span>In <b>${fmtTime(att?.check_in)}</b></span><span id="worked">Shift ${esc(shiftTxt)}</span><span>${state === 'done' ? 'Out' : 'Shift ends'} <b>${state === 'done' ? fmtTime(att.check_out) : fmtClock(sEnd)}</b></span></div>
      </div>
    </div>
  </section>

  ${isMgr() ? `<div class="stats">
    <a class="stat" href="#/approvals" style="text-decoration:none;color:inherit"><span>Leave requests to review</span><b>${apprCount}</b></a>
    <a class="stat" href="#/team" style="text-decoration:none;color:inherit"><span>Team on leave today</span><b>${onLeave.length}</b></a>
    <div class="stat"><span>Your pending requests</span><b>${pending.length}</b></div>
  </div>` : ''}

  <div class="grid g-2">
    <div class="grid" style="align-content:start">
      <div class="card">
        <div class="card-h"><h2>My tasks</h2><div class="right"><a class="btn sm" href="#/tasks">All tasks</a></div></div>
        <div class="card-b">${myTasks.length ? myTasks.map(t => {
          const running = S.running?.task_id === t.id;
          return `<div class="list-row"><div style="flex:1;min-width:0"><div class="task-title">${esc(t.title)}</div><div class="task-sub">${esc(t.project || 'No project')}${t.due_date ? ` · due <span class="${t.due_date < today ? 'overdue' : ''}">${fmtShort(t.due_date)}</span>` : ''}</div></div>
            ${running ? `<b class="num" data-live-timer style="color:var(--bad)"></b><button class="btn danger sm icon-btn" data-stop aria-label="Stop timer">${icon('stop')}Stop</button>` : `<button class="btn sm icon-btn" data-start="${t.id}" aria-label="Start timer">${icon('play')}Start</button>`}</div>`; }).join('')
          : '<div class="empty">No open tasks. Add one on the Tasks page to track your time.</div>'}</div>
      </div>
      <div class="card">
        <div class="card-h"><h2>Leave balance ${year}</h2><div class="right"><button class="btn primary sm" id="apply">${icon('plus')}Apply leave</button></div></div>
        <div class="card-b">${balanceRows(bals, pending, year)}</div>
      </div>
    </div>
    <div class="grid" style="align-content:start">
      <div class="card">
        <div class="card-h"><h2>Upcoming days off</h2></div>
        <div class="card-b">${upcoming.length ? upcoming.map(h => `<div class="list-row"><span class="date-chip"><b>${dObj(h.d).getDate()}</b><small>${dObj(h.d).toLocaleDateString('en-IN', { month: 'short' })}</small></span><div><b>${esc(h.r)}</b><div class="muted" style="font-size:13px">${dObj(h.d).toLocaleDateString('en-IN', { weekday: 'long' })}</div></div></div>`).join('') : '<div class="empty">No upcoming holidays added.</div>'}</div>
      </div>
      ${isMgr() ? `<div class="card">
        <div class="card-h"><h2>On leave today</h2></div>
        <div class="card-b">${onLeave.length ? onLeave.map(r => `<div class="list-row"><span class="avatar">${esc(initials(nameOf(r.employee_id)))}</span><div><b>${esc(nameOf(r.employee_id))}</b><div class="muted" style="font-size:13px">${esc(typeName(r.leave_type_id))} · back after ${fmtShort(r.end_date)}</div></div></div>`).join('') : '<div class="empty">Everyone is in today.</div>'}</div>
      </div>` : ''}
    </div>
  </div>`;

  const tick = () => {
    const c = $('#clock'); if (!c) return clearInterval(S.clockTimer);
    c.textContent = new Date().toLocaleTimeString('en-IN', { timeZone: TZ, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
    if (att?.check_in) {
      const end = att.check_out ? new Date(att.check_out) : new Date();
      const ms = end - new Date(att.check_in);
      $('#worked').textContent = dur(ms) + ' worked';
      $('#shift-fill').style.width = Math.min(100, ms / (shiftHours() * 36e5) * 100) + '%';
    }
  };
  tick(); S.clockTimer = setInterval(tick, 1000);
  paintTimer();

  $('#punch').onclick = async e => {
    if (!['in', 'out'].includes(state)) return;
    const b = e.currentTarget, orig = b.textContent;
    if (state === 'in' && !confirm('Check out for today? You can only check out once.' + (S.running ? ' Your task timer will stop too.' : ''))) return;
    b.disabled = true; b.textContent = 'Recording…';
    const loc = await getLocation();
    try {
      const fn = state === 'out' ? 'check_in' : 'check_out';
      const rec = await q(sb.rpc(fn, { lat: loc.lat ?? null, lng: loc.lng ?? null }));
      toast(fn === 'check_in' ? `Checked in at ${fmtTime(rec.check_in)}` : `Checked out at ${fmtTime(rec.check_out)}`);
      if (fn === 'check_out') await refreshRunning();
      route();
    } catch (err) { toast(err.message, 'bad'); b.disabled = false; b.textContent = orig; }
  };
  $('#apply').onclick = () => openApplyLeave();
  $$('[data-start]', el).forEach(b => b.onclick = () => startTimer(b.dataset.start));
  $$('[data-stop]', el).forEach(b => b.onclick = () => stopTimer());
};

/* ---------- Attendance ---------- */
VIEWS.attendance = async el => {
  const month = S.attMonth || istDate().slice(0, 7);
  const team = isMgr() ? teamList() : [];
  const who = S.attWho && team.some(p => p.id === S.attWho) ? S.attWho : S.me.id;
  el.innerHTML = `<div class="toolbar">
      <div class="field"><label for="a-month">Month</label><input id="a-month" type="month" value="${month}" max="${istDate().slice(0, 7)}"></div>
      ${team.length > 1 ? `<div class="field" style="min-width:220px"><label for="a-who">Employee</label><select id="a-who">${team.map(p => `<option value="${p.id}" ${p.id === who ? 'selected' : ''}>${esc(p.full_name || p.email)}${p.id === S.me.id ? ' (you)' : ''}</option>`).join('')}</select></div>` : ''}
    </div><div id="a-body"><div class="loading">Loading…</div></div>`;
  $('#a-month').onchange = e => { S.attMonth = e.target.value; route(); };
  $('#a-who') && ($('#a-who').onchange = e => { S.attWho = e.target.value; route(); });

  const { first, last, days } = monthBounds(month);
  const [att, leaves] = await Promise.all([
    q(sb.from('attendance').select('*').eq('employee_id', who).gte('work_date', first).lte('work_date', last)),
    q(sb.from('leave_requests').select('*').eq('employee_id', who).eq('status', 'approved').lte('start_date', last).gte('end_date', first))
  ]);
  const today = istDate(), from = trackFrom(profileOf(who));
  const rows = [];
  let present = 0, totalH = 0, leaveDays = 0, absent = 0, late = 0, missed = 0;
  for (let d = days; d >= 1; d--) {
    const date = `${month}-${pad2(d)}`;
    if (date > today || date < from) continue;
    const a = att.find(x => x.work_date === date);
    const lv = leaves.find(x => x.start_date <= date && x.end_date >= date);
    const off = offReason(date);
    let st;
    if (a?.check_in) {
      if (isMissed(a, date)) { missed++; st = '<span class="pill bad">Leave (missed check-out)</span>'; }
      else {
        present++; totalH += Number(a.hours_worked || 0);
        st = a.check_out ? '<span class="pill ok">Present</span>' : '<span class="pill info">Working</span>';
        if (isLate(a)) { late++; st += ` <span class="pill warn">Late ${lateBy(a)} min</span>`; }
      }
      if (lv) st += ` <span class="pill info">${lv.half_day ? 'Half-day leave' : 'Leave'}</span>`;
    } else if (lv) { leaveDays += lv.half_day ? 0.5 : 1; st = `<span class="pill info">${esc(typeName(lv.leave_type_id))}${lv.half_day ? ' (half day)' : ''}</span>`; }
    else if (off) st = `<span class="pill muted">${esc(off)}</span>`;
    else if (date === today) st = '<span class="pill warn">Not checked in</span>';
    else { absent++; st = '<span class="pill bad">Absent</span>'; }
    rows.push(`<tr><td><b>${fmtShort(date)}</b> <span class="muted">${dayName(date)}</span></td><td>${st}</td><td class="num">${fmtTime(a?.check_in)}</td><td class="num">${fmtTime(a?.check_out)}</td><td class="num">${a?.hours_worked != null ? num(a.hours_worked) + ' h' : '—'}</td>${isAdmin() ? `<td style="text-align:right"><button class="btn sm" data-fix="${date}">Edit</button></td>` : ''}</tr>`);
  }
  $('#a-body').innerHTML = `<div class="stats">
      <div class="stat"><span>Days present</span><b>${present}</b></div>
      <div class="stat"><span>Hours worked</span><b>${num(totalH)}</b></div>
      <div class="stat"><span>Average per day</span><b>${present ? num(totalH / present) : 0} h</b></div>
      <div class="stat"><span>Late days</span><b>${late}</b></div>
      <div class="stat"><span>Leave days</span><b>${num(leaveDays + missed)}</b></div>
      <div class="stat"><span>Absent</span><b>${absent}</b></div>
    </div>
    <div class="card"><div class="card-h"><h2>${esc(nameOf(who))}</h2><span class="sub">${dObj(first).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' })}</span></div>
    <div class="table-wrap"><table><thead><tr><th>Date</th><th>Status</th><th>Check in</th><th>Check out</th><th>Hours</th>${isAdmin() ? '<th></th>' : ''}</tr></thead>
    <tbody>${rows.join('') || `<tr><td colspan="6" class="empty">Attendance is counted from ${fmtDate(from)}. Nothing to show for this month.</td></tr>`}</tbody></table></div></div>`;
  $$('[data-fix]').forEach(b => b.onclick = () => openFixAttendance(who, b.dataset.fix, att.find(x => x.work_date === b.dataset.fix)));
};

function openFixAttendance(empId, date, a) {
  openModal({
    title: `Edit attendance: ${nameOf(empId)}, ${fmtDate(date)}`,
    body: `<div class="form-grid">
      <div class="field"><label for="fx-in">Check in</label><input id="fx-in" type="time" value="${istHM(a?.check_in)}"></div>
      <div class="field"><label for="fx-out">Check out</label><input id="fx-out" type="time" value="${istHM(a?.check_out)}"></div>
      <div class="field full"><label for="fx-note">Reason for change</label><input id="fx-note" type="text" value="${esc(a?.notes || '')}" placeholder="e.g. Forgot to check out, confirmed by manager"></div></div>`,
    footer: `${a ? '<button class="btn danger" id="fx-del" style="margin-right:auto">Clear this day</button>' : ''}<button class="btn" data-close>Cancel</button><button class="btn primary" id="fx-save">Save attendance</button>`,
    onMount: (root, close) => {
      $('[data-close]', root).onclick = close;
      $('#fx-save', root).onclick = async () => {
        const tin = $('#fx-in', root).value, tout = $('#fx-out', root).value, note = $('#fx-note', root).value.trim();
        if (!tin) return toast('Enter a check-in time', 'bad');
        if (tout && tout <= tin) return toast('Check-out must be after check-in', 'bad');
        const row = { check_in: `${date}T${tin}:00+05:30`, check_out: tout ? `${date}T${tout}:00+05:30` : null, notes: note || null };
        try {
          if (a) await q(sb.from('attendance').update(row).eq('id', a.id));
          else await q(sb.from('attendance').insert({ ...row, employee_id: empId, work_date: date }));
          close(); toast('Attendance saved'); route();
        } catch (e) { toast(e.message, 'bad'); }
      };
      $('#fx-del', root) && ($('#fx-del', root).onclick = async () => {
        if (!confirm('Remove check-in and check-out for this day?')) return;
        try { await q(sb.from('attendance').delete().eq('id', a.id)); close(); toast('Attendance cleared'); route(); }
        catch (e) { toast(e.message, 'bad'); }
      });
    }
  });
}

function openApplyLeave() {

  const today = istDate();
  openModal({
    title: 'Apply leave',
    body: `<form id="lv-form" class="form-grid">
      <div class="field full"><label for="lv-type">Leave type</label><select id="lv-type" required>${types.map(t => `<option value="${t.id}">${esc(t.name)}${t.is_paid ? '' : ' (unpaid)'}</option>`).join('')}</select></div>
      <div class="field"><label for="lv-from">From</label><input id="lv-from" type="date" value="${today}" required></div>
      <div class="field"><label for="lv-to">To</label><input id="lv-to" type="date" value="${today}" required></div>
      <label class="check full" id="half-wrap"><input type="checkbox" id="lv-half"> Half day</label>
      <div class="field full"><label for="lv-reason">Reason</label><textarea id="lv-reason" placeholder="Optional, but helps your manager decide faster"></textarea></div>
      <div class="note full">Sundays, Saturdays off and holidays aren't counted. The number of days is worked out for you when you submit.</div>
    </form>`,
    footer: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="lv-submit">Submit request</button>`,
    onMount: (root, close) => {
      const from = $('#lv-from', root), to = $('#lv-to', root), half = $('#lv-half', root), wrap = $('#half-wrap', root);
      const sync = () => { if (to.value < from.value) to.value = from.value; to.min = from.value; const single = from.value === to.value; wrap.style.display = single ? '' : 'none'; if (!single) half.checked = false; };
      from.onchange = sync; to.onchange = sync; sync();
      $('[data-close]', root).onclick = close;
      $('#lv-submit', root).onclick = async () => {
        const b = $('#lv-submit', root); b.disabled = true;
        try {
          const rec = await q(sb.from('leave_requests').insert({
            employee_id: S.me.id, leave_type_id: +$('#lv-type', root).value,
            start_date: from.value, end_date: to.value, half_day: half.checked,
            reason: $('#lv-reason', root).value.trim() || null
          }).select().single());
          close(); toast(`Leave requested for ${num(rec.days)} day${rec.days == 1 ? '' : 's'}`);
          route();
        } catch (e) { toast(e.message, 'bad'); b.disabled = false; }
      };
    }
  });
}

VIEWS.team = async el => {
  const today = istDate();
  const members = teamList().filter(p => p.id !== S.me.id);
  const [att, leaves, running] = await Promise.all([
    q(sb.from('attendance').select('*').eq('work_date', today)),
    q(sb.from('leave_requests').select('*').eq('status', 'approved').lte('start_date', today).gte('end_date', today)),

  ]);
  const taskIds = running.map(r => r.task_id);
  const tasks = taskIds.length ? await q(sb.from('tasks').select('id,title').in('id', taskIds)).catch(() => []) : [];
  const off = offReason(today);
  let inC = 0, outC = 0, lvC = 0, lateC = 0;
  const rows = members.map(p => {
    const a = att.find(x => x.employee_id === p.id), lv = leaves.find(x => x.employee_id === p.id), run = running.find(r => r.employee_id === p.id);
    let st;
    if (a?.check_in) {
      inC++;
      st = isMissed(a, today) ? '<span class="pill bad">Missed check-out</span>' : a.check_out ? '<span class="pill ok">Checked out</span>' : '<span class="pill ok">Working</span>';

    else { outC++; st = '<span class="pill warn">Not checked in</span>'; }

    const cur = run ? `<span class="task-title">${esc(tasks.find(t => t.id === run.task_id)?.title || 'Task')}</span><div class="task-sub">for ${hm((Date.now() - new Date(run.started_at)) / 60000)}</div>` : '<span class="muted">—</span>';

      <div class="stat"><span>On leave</span><b>${lvC}</b></div></div>
    <div class="card"><div class="card-h"><h2>Today</h2><span class="sub">${fmtDate(today)}${off ? ` (${esc(off)})` : ''}</span></div>
    <div class="table-wrap"><table><thead><tr><th>Employee</th><th>Status</th><th>Check in</th><th>Check out</th><th>Worked</th><th>Working on</th></tr></thead>
    <tbody>${rows.join('') || `<tr><td colspan="6" class="empty">No one reports to you yet. ${isAdmin() ? 'Set managers on the Employees page.' : 'Ask your HR admin to assign your team.'}</td></tr>`}</tbody></table></div></div>`;
};

/* ---------- Reports ---------- */
function downloadCSV(name, rows) {
  const csv = rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}

  const people = teamList();
  const [att, leaves, logs] = await Promise.all([
    q(sb.from('attendance').select('*').gte('work_date', first).lte('work_date', last).order('work_date')),
    q(sb.from('leave_requests').select('*').lte('start_date', last).gte('end_date', first).order('start_date')),
    q(sb.from('time_logs').select('*').gte('started_at', `${first}T00:00:00+05:30`).lte('started_at', `${last}T23:59:59+05:30`).order('started_at')).catch(() => [])
  ]);
  const taskIds = [...new Set(logs.map(l => l.task_id))];
  const tasks = taskIds.length ? await q(sb.from('tasks').select('id,title,project').in('id', taskIds)).catch(() => []) : [];
  const summary = people.map(p => {
    const a = att.filter(x => x.employee_id === p.id && x.check_in);
    const ok = a.filter(x => !isMissed(x, x.work_date));
    const lv = leaves.filter(x => x.employee_id === p.id && x.status === 'approved');
    return { p, days: ok.length, hours: ok.reduce((s, x) => s + Number(x.hours_worked || 0), 0), late: ok.filter(isLate).length,
      missed: a.length - ok.length, leave: lv.reduce((s, x) => s + Number(x.days), 0),
      task: logs.filter(l => l.employee_id === p.id).reduce((s, l) => s + logMinutes(l), 0) };
  });
  el.innerHTML = `<div class="toolbar">
      <div class="field"><label for="r-month">Month</label><input id="r-month" type="month" value="${month}"></div>
      <div class="grow"></div>
      <button class="btn" id="dl-att">${icon('download')}Attendance CSV</button>
      <button class="btn" id="dl-lv">${icon('download')}Leave CSV</button>
      <button class="btn" id="dl-tk">${icon('download')}Task time CSV</button></div>
    <div class="card"><div class="card-h"><h2>Monthly summary</h2><span class="sub">${dObj(first).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' })}</span></div>
    <div class="table-wrap"><table><thead><tr><th>Employee</th><th>Days present</th><th>Hours</th><th>Avg / day</th><th>Late days</th><th>Missed check-out (leave)</th><th>Approved leave</th><th>Task time</th></tr></thead><tbody>
    ${summary.map(s => `<tr><td><b>${esc(s.p.full_name || s.p.email)}</b><div class="task-sub">${esc(s.p.designation || s.p.department || '')}</div></td><td class="num">${s.days}</td><td class="num">${num(s.hours)}</td><td class="num">${s.days ? num(s.hours / s.days) : '0'}</td><td class="num">${s.late ? `<span class="pill warn">${s.late}</span>` : '0'}</td><td class="num">${s.missed ? `<span class="pill bad">${s.missed}</span>` : '0'}</td><td class="num">${num(s.leave)}</td><td class="num">${hm(s.task)}</td></tr>`).join('') || '<tr><td colspan="8" class="empty">No employees to report on.</td></tr>'}
    </tbody></table></div></div>`;
  $('#r-month').onchange = e => { S.repMonth = e.target.value; route(); };
  $('#dl-att').onclick = () => downloadCSV(`attendance-${month}.csv`, [
    ['Employee ID', 'Name', 'Department', 'Date', 'Check in', 'Check out', 'Hours', 'Status', 'Late (min)', 'Check-in location', 'Note'],
    ...att.map(a => { const p = profileOf(a.employee_id); const miss = isMissed(a, a.work_date); return [p.employee_code, p.full_name, p.department, a.work_date, fmtTime(a.check_in), fmtTime(a.check_out), a.hours_worked ?? '', miss ? 'Leave (missed check-out)' : a.check_out ? 'Present' : 'Working', a.check_in && isLate(a) ? lateBy(a) : '', a.check_in_lat ? `${a.check_in_lat},${a.check_in_lng}` : '', a.notes]; })
  ]);
  $('#dl-lv').onclick = () => downloadCSV(`leave-${month}.csv`, [
    ['Employee ID', 'Name', 'Leave type', 'From', 'To', 'Days', 'Status', 'Reason', 'Decided by', 'Comment'],
    ...leaves.map(r => { const p = profileOf(r.employee_id); return [p.employee_code, p.full_name, typeName(r.leave_type_id), r.start_date, r.end_date, r.days, r.status, r.reason, r.approver_id ? nameOf(r.approver_id) : '', r.approver_comment]; })
  ]);
  $('#dl-tk').onclick = () => downloadCSV(`task-time-${month}.csv`, [
    ['Employee ID', 'Name', 'Date', 'Project', 'Task', 'Start', 'End', 'Minutes'],
    ...logs.map(l => { const p = profileOf(l.employee_id), t = tasks.find(x => x.id === l.task_id) || {}; return [p.employee_code, p.full_name, istDate(new Date(l.started_at)), t.project, t.title, fmtTime(l.started_at), l.ended_at ? fmtTime(l.ended_at) : 'Running', Math.round(logMinutes(l))]; })
  ]);
};

async function editEmployee(id) {
  const p = profileOf(id), year = +istDate().slice(0, 4);
  const bals = await q(sb.from('leave_balances').select('*').eq('employee_id', id).eq('year', year));
  const paidTypes = S.leaveTypes.filter(t => t.is_paid && t.is_active);
  const managers = S.profiles.filter(x => x.id !== id && x.is_active && (x.role === 'manager' || x.role === 'admin'));
  openModal({
    title: `Edit ${p.full_name || p.email}`,
    body: `<div class="form-grid">
      <div class="field"><label for="f-name">Full name</label><input id="f-name" type="text" value="${esc(p.full_name)}"></div>
      <div class="field"><label for="f-code">Employee ID</label><input id="f-code" type="text" value="${esc(p.employee_code || '')}"></div>
      <div class="field"><label for="f-dept">Department</label><input id="f-dept" type="text" value="${esc(p.department || '')}"></div>
      <div class="field"><label for="f-desig">Designation</label><input id="f-desig" type="text" value="${esc(p.designation || '')}"></div>
      <div class="field"><label for="f-role">Role</label><select id="f-role">${['employee', 'manager', 'admin'].map(r => `<option value="${r}" ${p.role === r ? 'selected' : ''}>${r[0].toUpperCase() + r.slice(1)}</option>`).join('')}</select></div>
      <div class="field"><label for="f-mgr">Reports to</label><select id="f-mgr"><option value="">No manager</option>${managers.map(m => `<option value="${m.id}" ${p.manager_id === m.id ? 'selected' : ''}>${esc(m.full_name || m.email)}</option>`).join('')}</select></div>
      <div class="field"><label for="f-doj">Date of joining</label><input id="f-doj" type="date" value="${esc(p.date_of_joining || '')}"></div>
      <div class="field"><label for="f-active">Status</label><select id="f-active"><option value="1" ${p.is_active ? 'selected' : ''}>Active</option><option value="0" ${!p.is_active ? 'selected' : ''}>Inactive (can't sign in)</option></select></div>
      <div class="full" style="margin-top:6px"><b>Leave allotted for ${year}</b><div class="hint muted" style="font-size:12.5px">Days used so far are kept as they are.</div></div>
      ${paidTypes.map(t => { const b = bals.find(x => x.leave_type_id === t.id); return `<div class="field"><label for="f-bal-${t.id}">${esc(t.name)}${b ? ` <span class="muted">(${num(b.used)} used)</span>` : ''}</label><input id="f-bal-${t.id}" data-bal="${t.id}" type="number" min="0" step="0.5" value="${b ? num(b.allotted) : ''}" placeholder="${num(t.annual_quota)}"></div>`; }).join('')}
    </div>`,
    footer: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="f-save">Save changes</button>`,
    onMount: (root, close) => {
      $('[data-close]', root).onclick = close;
      $('#f-save', root).onclick = async () => {
        const v = s => $(s, root).value.trim();
        try {
          await q(sb.from('profiles').update({
            full_name: v('#f-name'), employee_code: v('#f-code') || null, department: v('#f-dept') || null,
            designation: v('#f-desig') || null, role: v('#f-role'), manager_id: v('#f-mgr') || null,
            date_of_joining: v('#f-doj') || null, is_active: v('#f-active') === '1'
          }).eq('id', id));
          const ups = $$('[data-bal]', root).filter(i => i.value !== '').map(i => ({ employee_id: id, leave_type_id: +i.dataset.bal, year, allotted: +i.value }));
          if (ups.length) await q(sb.from('leave_balances').upsert(ups, { onConflict: 'employee_id,leave_type_id,year' }));
          close(); toast('Employee saved');
          if (id === S.me.id) { await loadDirectory(); S.me = profileOf(id); S.shell = false; }
          route();
        } catch (e) { toast(e.message, 'bad'); }
      };
    }
  });
}

/* ---------- Tasks & timer ---------- */
const PRIORITY = { high: ['bad', 'High'], medium: ['warn', 'Medium'], low: ['muted', 'Low'] };
const TSTATUS = { todo: 'To do', in_progress: 'In progress', done: 'Done' };

VIEWS.tasks = async el => {
  const scope = isMgr() ? S.taskScope : 'mine', filter = S.taskFilter, today = istDate();
  let qb = sb.from('tasks').select('*').order('created_at', { ascending: false }).limit(150);
  qb = scope === 'mine' ? qb.eq('assigned_to', S.me.id) : qb.neq('assigned_to', S.me.id);
  if (filter === 'open') qb = qb.neq('status', 'done'); else if (filter === 'done') qb = qb.eq('status', 'done');
  const [tasks, todayLogs] = await Promise.all([
    q(qb),
    q(sb.from('time_logs').select('*').eq('employee_id', S.me.id).gte('started_at', `${today}T00:00:00+05:30`))
  ]);
  const logs = tasks.length ? await q(sb.from('time_logs').select('task_id,started_at,ended_at,minutes').in('task_id', tasks.map(t => t.id))) : [];
  const spent = id => logs.filter(l => l.task_id === id).reduce((s, l) => s + logMinutes(l), 0);
  const order = { in_progress: 0, todo: 1, done: 2 };
  tasks.sort((a, b) => order[a.status] - order[b.status] || (a.due_date || '9999').localeCompare(b.due_date || '9999'));
  const overdue = tasks.filter(t => t.status !== 'done' && t.due_date && t.due_date < today).length;

  el.innerHTML = `<div class="toolbar">
      ${isMgr() ? `<div class="field"><label>View</label><div class="seg" role="tablist"><button data-scope="mine" class="${scope === 'mine' ? 'on' : ''}">My tasks</button><button data-scope="team" class="${scope === 'team' ? 'on' : ''}">Team tasks</button></div></div>` : ''}
      <div class="field"><label for="t-filter">Show</label><select id="t-filter"><option value="open" ${filter === 'open' ? 'selected' : ''}>Open tasks</option><option value="done" ${filter === 'done' ? 'selected' : ''}>Done</option><option value="all" ${filter === 'all' ? 'selected' : ''}>All</option></select></div>
      <div class="field grow"><label for="t-search">Search</label><input id="t-search" type="text" placeholder="Task, project or person"></div>
      <button class="btn primary" id="t-new">${icon('plus')}New task</button>
    </div>
    ${S.running ? `<div class="run-banner"><span class="rec"></span><div style="min-width:0"><small>Timer running</small><b>${esc(S.running.task?.title || 'Task')}</b>${S.running.task?.project ? `<div class="task-sub">${esc(S.running.task.project)}</div>` : ''}</div><b class="num big" data-live-timer>0:00:00</b><button class="btn danger" data-stop>${icon('stop')}Stop</button></div>` : ''}
    <div class="stats">
      <div class="stat"><span>Tracked today (you)</span><b>${hm(todayLogs.reduce((s, l) => s + logMinutes(l), 0))}</b></div>
      <div class="stat"><span>In progress</span><b>${tasks.filter(t => t.status === 'in_progress').length}</b></div>
      <div class="stat"><span>To do</span><b>${tasks.filter(t => t.status === 'todo').length}</b></div>
      <div class="stat"><span>Overdue</span><b>${overdue}</b></div>
    </div>
    <div class="card"><div class="table-wrap"><table><thead><tr><th>Task</th>${scope === 'team' ? '<th>Assigned to</th>' : ''}<th>Due</th><th>Priority</th><th>Status</th><th>Time</th><th></th></tr></thead>
    <tbody id="t-rows">${tasks.length ? tasks.map(t => {
      const mine = t.assigned_to === S.me.id, running = S.running?.task_id === t.id;
      const [pc, pl] = PRIORITY[t.priority] || PRIORITY.medium;
      return `<tr data-s="${esc((t.title + ' ' + (t.project || '') + ' ' + nameOf(t.assigned_to)).toLowerCase())}">
        <td style="white-space:normal;min-width:220px"><div class="task-title">${esc(t.title)}</div><div class="task-sub">${esc(t.project || 'No project')}</div></td>
        ${scope === 'team' ? `<td>${esc(nameOf(t.assigned_to))}</td>` : ''}
        <td class="num">${t.due_date ? `<span class="${t.status !== 'done' && t.due_date < today ? 'overdue' : ''}">${fmtShort(t.due_date)}</span>` : '<span class="muted">—</span>'}</td>
        <td><span class="pill ${pc}">${pl}</span></td>
        <td><select class="mini" data-status="${t.id}" aria-label="Status">${Object.entries(TSTATUS).map(([v, l]) => `<option value="${v}" ${t.status === v ? 'selected' : ''}>${l}</option>`).join('')}</select></td>
        <td class="num">${running ? '<b data-live-timer style="color:var(--bad)">0:00:00</b>' : hm(spent(t.id))}</td>
        <td style="text-align:right;white-space:nowrap">${mine && t.status !== 'done' ? (running ? `<button class="btn danger sm icon-btn" data-stop>${icon('stop')}Stop</button>` : `<button class="btn sm icon-btn" data-start="${t.id}">${icon('play')}Start</button>`) : ''} <button class="btn sm" data-edit="${t.id}">Edit</button></td></tr>`; }).join('')
      : `<tr><td colspan="7" class="empty">${filter === 'done' ? 'No finished tasks yet.' : 'No open tasks. Create one and press Start to track your time.'}</td></tr>`}</tbody></table></div></div>`;

  $$('[data-scope]', el).forEach(b => b.onclick = () => { S.taskScope = b.dataset.scope; route(); });
  $('#t-filter').onchange = e => { S.taskFilter = e.target.value; route(); };
  $('#t-search').oninput = e => { const v = e.target.value.toLowerCase(); $$('#t-rows tr[data-s]').forEach(r => r.style.display = r.dataset.s.includes(v) ? '' : 'none'); };
  $('#t-new').onclick = () => openTask(null);
  $$('[data-start]', el).forEach(b => b.onclick = () => startTimer(b.dataset.start));
  $$('[data-stop]', el).forEach(b => b.onclick = () => stopTimer());
  $$('[data-edit]', el).forEach(b => b.onclick = () => openTask(tasks.find(t => t.id === b.dataset.edit)));
  $$('[data-status]', el).forEach(sel => sel.onchange = async () => {
    try { await q(sb.from('tasks').update({ status: sel.value }).eq('id', sel.dataset.status)); toast(`Marked as ${TSTATUS[sel.value].toLowerCase()}`); await refreshRunning(); route(); }
    catch (e) { toast(e.message, 'bad'); }
  });
  paintTimer();
};

async function openTask(task) {
  const isNew = !task;
  const people = isAdmin() ? S.profiles.filter(p => p.is_active) : isMgr() ? teamList() : [S.me];
  const logs = isNew ? [] : await q(sb.from('time_logs').select('*').eq('task_id', task.id).order('started_at', { ascending: false }).limit(50));
  const t = task || { priority: 'medium', status: 'todo', assigned_to: S.me.id };
  const canDelete = !isNew && (t.created_by === S.me.id || isAdmin());
  const projects = [...new Set((await q(sb.from('tasks').select('project').not('project', 'is', null).limit(300)).catch(() => [])).map(x => x.project))];
  openModal({
    title: isNew ? 'New task' : 'Edit task',
    body: `<div class="form-grid">
      <div class="field full"><label for="tk-title">Task</label><input id="tk-title" type="text" value="${esc(t.title || '')}" placeholder="e.g. Update homepage banner for Navdrushti"></div>
      <div class="field"><label for="tk-project">Project or client</label><input id="tk-project" type="text" list="tk-projects" value="${esc(t.project || '')}" placeholder="e.g. Navdrushti website"><datalist id="tk-projects">${projects.map(p => `<option value="${esc(p)}">`).join('')}</datalist></div>
      <div class="field"><label for="tk-who">Assigned to</label><select id="tk-who" ${people.length < 2 ? 'disabled' : ''}>${people.map(p => `<option value="${p.id}" ${p.id === t.assigned_to ? 'selected' : ''}>${esc(p.full_name || p.email)}${p.id === S.me.id ? ' (you)' : ''}</option>`).join('')}</select></div>
      <div class="field"><label for="tk-due">Due date</label><input id="tk-due" type="date" value="${esc(t.due_date || '')}"></div>
      <div class="field"><label for="tk-pri">Priority</label><select id="tk-pri">${Object.entries(PRIORITY).map(([v, [, l]]) => `<option value="${v}" ${t.priority === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      ${isNew ? '' : `<div class="field"><label for="tk-status">Status</label><select id="tk-status">${Object.entries(TSTATUS).map(([v, l]) => `<option value="${v}" ${t.status === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>`}
      <div class="field full"><label for="tk-desc">Details</label><textarea id="tk-desc" placeholder="Optional">${esc(t.description || '')}</textarea></div>
      ${isNew ? '' : `<div class="full"><b>Time logged: ${hm(logs.reduce((s, l) => s + logMinutes(l), 0))}</b>
        ${logs.length ? `<div class="table-wrap" style="margin-top:8px;border:1px solid var(--line);border-radius:8px"><table><thead><tr><th>Who</th><th>Date</th><th>From – to</th><th>Time</th></tr></thead><tbody>${logs.map(l => `<tr><td>${esc(nameOf(l.employee_id))}</td><td>${fmtShort(istDate(new Date(l.started_at)))}</td><td class="num">${fmtTime(l.started_at)} – ${l.ended_at ? fmtTime(l.ended_at) : 'running'}</td><td class="num">${hm(logMinutes(l))}</td></tr>`).join('')}</tbody></table></div>` : '<div class="muted" style="font-size:13px">No time logged yet.</div>'}</div>`}
    </div>`,
    footer: `${canDelete ? '<button class="btn danger" id="tk-del" style="margin-right:auto">Delete task</button>' : ''}<button class="btn" data-close>Cancel</button><button class="btn primary" id="tk-save">${isNew ? 'Create task' : 'Save task'}</button>`,
    onMount: (root, close) => {
      $('[data-close]', root).onclick = close;
      $('#tk-save', root).onclick = async () => {
        const v = id => $(id, root)?.value.trim();
        const row = { title: v('#tk-title'), project: v('#tk-project') || null, assigned_to: v('#tk-who') || S.me.id, due_date: v('#tk-due') || null, priority: v('#tk-pri'), description: v('#tk-desc') || null };
        if (!row.title) return toast('Enter a task name', 'bad');
        if (!isNew) row.status = v('#tk-status');
        try {
          if (isNew) await q(sb.from('tasks').insert({ ...row, created_by: S.me.id }));
          else await q(sb.from('tasks').update(row).eq('id', t.id));
          close(); toast(isNew ? 'Task created' : 'Task saved'); await refreshRunning(); route();
        } catch (e) { toast(e.message, 'bad'); }
      };
      $('#tk-del', root) && ($('#tk-del', root).onclick = async () => {
        if (!confirm('Delete this task and its time logs?')) return;
        try { await q(sb.from('tasks').delete().eq('id', t.id)); close(); toast('Task deleted'); await refreshRunning(); route(); }
        catch (e) { toast(e.message, 'bad'); }
      });
    }
  });
}

/* ---------- Boot ---------- */
(async function boot() {
  if (!configured) return renderSetup();
  const isRecovery = location.hash.includes('type=recovery');
  sb.auth.onAuthStateChange(evt => {
    if (evt === 'PASSWORD_RECOVERY') setTimeout(renderResetPassword, 0);
    if (evt === 'SIGNED_OUT') { S.me = null; S.shell = false; setTimeout(renderLogin, 0); }
  });
  if (isRecovery) return;
  const { data: { session } } = await sb.auth.getSession();
  session ? startApp() : renderLogin();
})();
</script>
